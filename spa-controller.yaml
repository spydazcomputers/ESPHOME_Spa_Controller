### ═══════════════════════════════════════════════════════════════════════════
### GLOBALS — persistent and runtime state variables
### ═══════════════════════════════════════════════════════════════════════════

globals:
  ### ── Boot / Safety Flags ──────────────────────────────────────────────
  - id: startup_test_complete
    type: bool
    restore_value: no
    initial_value: "false"
  - id: high_temp_alarm
    type: bool
    restore_value: no
    initial_value: "false"
  - id: hi_limit_triggered
    type: bool
    restore_value: no
    initial_value: "false"
  - id: boot_testing_active
    type: bool
    restore_value: no
    initial_value: "true"
  - id: boot_failed
    type: bool
    restore_value: no
    initial_value: "false"

  ### ── Heater Test Baselines ────────────────────────────────────────────
  - id: heater_temp_baseline_inlet
    type: float
    restore_value: no
  - id: heater_temp_baseline_outlet
    type: float
    restore_value: no

  ### ── Heater Test Pulse Duration ───────────────────────────────────────
  ### Duration in milliseconds for the initial heater-on period in Step 3.
  ### Tunable from HA without reflashing. Clamped to 6000 ms max in the
  ### test script regardless of what HA sends.
  - id: heater_pulse_ms
    type: uint32_t
    restore_value: yes
    initial_value: "5000"

  ### ── Spa Temperature Calibration ──────────────────────────────────────
  ### Additive offset applied to the raw NTC reading. Positive = reads
  ### warmer, negative = reads cooler. Persists across reboots.
  - id: spa_temp_offset
    type: float
    restore_value: yes
    initial_value: "0.0"

  ### ── Thermostat Tuning ────────────────────────────────────────────────
  - id: temp_deadband
    type: float
    restore_value: no
    initial_value: "0.8"

  ### ── Pump Auto-Off Timer ──────────────────────────────────────────────
  ### Duration in minutes before a manually-activated pump automatically
  ### shuts off. Only applies to pumps started via HA buttons — pumps
  ### started by the thermostat, filter cycle, or startup test are NOT
  ### subject to this timer. Persists across reboots.
  - id: pump_auto_off_minutes
    type: uint32_t
    restore_value: yes
    initial_value: "30"

  ### ── Filter Cycle State (survives reboot) ─────────────────────────────
  - id: filter_last_run_time
    type: uint32_t
    restore_value: yes
    initial_value: "0"
  - id: filter_cycle_enabled
    type: bool
    restore_value: yes
    initial_value: "true"
  - id: filter_interval_minutes
    type: uint32_t
    restore_value: yes
    initial_value: "120"
  - id: filter_runtime_minutes
    type: uint32_t
    restore_value: yes
    initial_value: "10"
  ### True while a filter cycle (automatic or manual) is actively running.
  ### Used by the filter timer text sensors and to prevent overlapping runs.
  - id: filter_running
    type: bool
    restore_value: no
    initial_value: "false"

  ### ── Faceplate / Config Mode ──────────────────────────────────────────
  - id: config_mode
    type: bool
    restore_value: no
    initial_value: "false"
  - id: config_hold_start
    type: uint32_t
    restore_value: no
    initial_value: "0"

### ═══════════════════════════════════════════════════════════════════════════
### OUTPUTS — heater safety relay GPIOs (not exposed to HA directly)
### ═══════════════════════════════════════════════════════════════════════════
### These are the three relays in the Apollo 11 relay box that form the
### heater safety chain. They are ESPHome "outputs" (not "switches") so
### they are never directly visible in Home Assistant. The virtual_heater
### template switch is the only approved way to control them.

output:
  ### Pin 2 — Hi-limit relay 1 (safety, series with heater)
  - platform: gpio
    pin: GPIO32
    inverted: false
    id: r_HiLim_1

  ### Pin 3 — Hi-limit relay 2 (safety, series with heater)
  - platform: gpio
    pin: GPIO33
    inverted: false
    id: r_HiLim_2

  ### Pin 4 — Heater coil relay (energises the heating element)
  - platform: gpio
    pin: GPIO25
    inverted: false
    id: r_Heater

### ═══════════════════════════════════════════════════════════════════════════
### SWITCHES — relay GPIOs (pump switches are internal only)
### ═══════════════════════════════════════════════════════════════════════════
### Pump switches (P1 Low, P1 High, P2 High) are internal: true — they are
### NOT directly visible in Home Assistant. Users control pumps via HA
### buttons (see BUTTONS section) which act as toggles with an auto-off
### safety countdown. This prevents a pump from being accidentally left
### on forever.
###
### The thermostat (virtual_heater), filter cycle, and startup test scripts
### call these switches directly — they are NOT subject to the auto-off
### timer because those subsystems manage their own shutdown.
###
### The circulator pump is the EXCEPTION — it stays visible in HA as a
### regular toggle switch because it runs continuously after boot and
### should not be subject to an auto-off timer.
###
### NOTE: Pump 2 Low is not supported by the current motor. Pin 14 /
### GPIO12 is reserved for future use. Only P2 High exists in this config.

switch:
  ### Pin 10 — Pump 1 low speed (used for heater flow)
  ### Internal only — HA controls via "Pump 1 Low" button + auto-off script.
  - platform: gpio
    pin: GPIO26
    id: r_P1_low
    inverted: false
    interlock: [r_P1_low, r_P1_high]
    name: "Pump 1 Low"
    internal: true

  ### Pin 11 — Pump 1 high speed (jets)
  ### Internal only — HA controls via "Pump 1 High (Jets)" button + auto-off.
  ### Interlocked with P1 Low — turning on High automatically turns off Low.
  - platform: gpio
    pin: GPIO27
    id: r_P1_high
    inverted: false
    interlock: [r_P1_low, r_P1_high]
    name: "Pump 1 High"
    internal: true

  ### Pin 13 — Circulator pump (low-flow circulation)
  ### NOT internal — visible in HA as a regular toggle switch.
  ### Runs continuously after boot; no auto-off timer.
  - platform: gpio
    pin: GPIO14
    id: r_Circ
    inverted: false
    name: "Circ Pump"

  # Pin 14 — reserved for future P2 Low. Driven low to prevent
  # GPIO12 strapping pin from floating high at boot.
  - platform: gpio
    pin: GPIO21
    id: r_P2_low_reserved
    inverted: false

  ### Pin 15 — Pump 2 high speed (only speed available)
  ### Internal only — HA controls via "Pump 2 High" button + auto-off.
  ### Filter cycle also uses this switch directly.
  - platform: gpio
    pin: GPIO13
    id: r_P2_high
    inverted: false
    name: "Pump 2 High"
    internal: true

  ### Virtual heater — the ONLY safe way to turn the heater on.
  ### Enforces the correct energisation/de-energisation sequence for
  ### the three-relay series chain inside the Apollo 11 relay box.
  - platform: template
    name: "Virtual Heater"
    id: virtual_heater
    optimistic: true
    turn_on_action:
      - output.turn_on: r_HiLim_1
      - output.turn_on: r_HiLim_2
      - delay: 500ms
      - switch.turn_on: r_P1_low
      - delay: 500ms
      - output.turn_on: r_Heater
    turn_off_action:
      - output.turn_off: r_Heater
      - delay: 500ms
      - switch.turn_off: r_P1_low
      - output.turn_off: r_HiLim_2
      - output.turn_off: r_HiLim_1

### ═══════════════════════════════════════════════════════════════════════════
### SENSORS — temperature measurement chain
### ═══════════════════════════════════════════════════════════════════════════

sensor:
  ### ── OUTLET TEMPERATURE (Pin 6 / GPIO39) ─────────────────────────────
  ### OEM sensor — built into the Apollo 11 relay box, physically attached
  ### to the heater manifold outlet. Signal carried through DB15 connector.
  - platform: adc
    id: outlet_sensor
    pin: GPIO39
    update_interval: 2s
    name: "Outlet Voltage"
    attenuation: auto
    internal: True

  - platform: resistance
    id: outlet_resistance
    sensor: outlet_sensor
    configuration: DOWNSTREAM
    resistor: 9.0kOhm
    name: "Outlet Resistance Sensor"
    internal: True


  - platform: ntc
    sensor: outlet_resistance
    calibration:
      - 10.0kOhm -> 25°C
      - 32.665kOhm -> 0°C
      - 6.530kOhm -> 35°C
    id: outlet_temp
    name: "Outlet Temperature"
    filters:
      - median:
          window_size: 5
          send_every: 1
      - exponential_moving_average:
          alpha: 0.15
          send_every: 1
     
    on_value:
      then:
        - if:
            condition:
              lambda: "return !id(boot_testing_active);"
            then:
              - script.execute: check_high_temp_alarm

  ### ── INLET TEMPERATURE (Pin 5 / GPIO36) ──────────────────────────────
  ### OEM sensor — built into the Apollo 11 relay box, physically attached
  ### to the heater manifold inlet. Signal carried through DB15 connector.
  - platform: adc
    id: inlet_sensor
    pin: GPIO36
    update_interval: 2s
    name: "Inlet Voltage"
    attenuation: auto
    internal: True


  - platform: resistance
    id: inlet_resistance
    sensor: inlet_sensor
    configuration: DOWNSTREAM
    resistor: 9.0kOhm
    name: "Inlet Resistance Sensor"
    internal: True

  - platform: ntc
    sensor: inlet_resistance
    calibration:
      - 10.0kOhm -> 25°C
      - 32.665kOhm -> 0°C
      - 6.530kOhm -> 35°C
    id: inlet_temp
    name: "Inlet Temperature"
    filters:
      - median:
          window_size: 5
          send_every: 1
      - exponential_moving_average:
          alpha: 0.15
          send_every: 1
          
    on_value:
      then:
        - if:
            condition:
              lambda: "return !id(boot_testing_active);"
            then:
              - script.execute: check_high_temp_alarm

 ### ── SPA / JACUZZI TEMPERATURE (GPIO34 — separate wiring loom) ───────
  ### EXTERNAL sensor — added as part of this project. NOT part of the
  ### Apollo 11 relay box or DB15 connector. Wired on a separate loom
  ### directly to the ESP32 to measure the actual spa body water
  ### temperature for thermostat control.
  - platform: adc
    id: spa_sensor
    pin: GPIO34
    update_interval: 2s
    name: "Spa Voltage"
    attenuation: 12db
    samples: 64
    internal: True

  - platform: resistance
    id: spa_resistance
    sensor: spa_sensor
    configuration: UPSTREAM
    resistor: 10.0kOhm
    name: "Spa Resistance Sensor"
    internal: True

  ### Raw NTC output — used as the source for the calibrated template sensor.
  ### Not hidden from HA so you can compare raw vs. corrected on a dashboard.
  - platform: ntc
    sensor: spa_resistance
    calibration:
      - 10.0kOhm -> 25°C
      - 32.665kOhm -> 0°C
      #- 7.160kOhm -> 35°C
      - 6.53kOhm -> 35°C
    id: spa_temp_raw
    name: "Spa Temperature Raw"
    filters:
      - median:
          window_size: 5
          send_every: 1
      - exponential_moving_average:
          alpha: 0.50
          send_every: 1
    internal: True

  ### Calibrated spa temperature — applies the user-adjustable offset from
  ### the spa_temp_offset global. This is the sensor referenced by the
  ### thermostat climate entity and the high-temp alarm.
  - platform: template
    name: "Spa Temperature"
    id: spa_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      if (isnan(id(spa_temp_raw).state)) return NAN;
      return id(spa_temp_raw).state + id(spa_temp_offset);

  ### ── WiFi Signal Strength (for OLED display) ─────────────────────────
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 30s
    internal: true

### ═══════════════════════════════════════════════════════════════════════════
### BINARY SENSORS — boolean status exposed to Home Assistant
### ═══════════════════════════════════════════════════════════════════════════

binary_sensor:
  - platform: template
    name: "Startup Test Complete"
    id: startup_test_complete_sensor
    lambda: "return id(startup_test_complete);"

  - platform: template
    name: "High Temperature Alarm"
    id: high_temp_alarm_sensor
    lambda: "return id(high_temp_alarm);"

  - platform: template
    name: "Hi-Limit Relay Triggered"
    id: hi_limit_triggered_sensor
    lambda: "return id(hi_limit_triggered);"

  - platform: template
    name: "Boot Failed"
    id: boot_failed_sensor
    lambda: "return id(boot_failed);"

  ### ── Pump Running Status ──────────────────────────────────────────────
  ### Since the pump GPIO switches are internal: true (hidden from HA),
  ### these binary sensors expose pump on/off state to HA dashboards for
  ### status indicators and conditional card visibility.
  - platform: template
    name: "Pump 1 Low Running"
    lambda: "return id(r_P1_low).state;"

  - platform: template
    name: "Pump 1 High Running"
    lambda: "return id(r_P1_high).state;"

  - platform: template
    name: "Pump 2 High Running"
    lambda: "return id(r_P2_high).state;"

  ### ── Faceplate Buttons (right-side GPIOs, active LOW, internal) ──────
  - platform: gpio
    id: btn_p1
    pin:
      number: GPIO19
      mode: INPUT_PULLUP
      inverted: true
    internal: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: faceplate_p1_cycle

  - platform: gpio
    id: btn_p2
    pin:
      number: GPIO18
      mode: INPUT_PULLUP
      inverted: true
    internal: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: faceplate_p2_cycle

  - platform: gpio
    id: btn_temp_up
    pin:
      number: GPIO16
      mode: INPUT_PULLUP
      inverted: true
    internal: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: adjust_setpoint_up

  - platform: gpio
    id: btn_temp_down
    pin:
      number: GPIO17
      mode: INPUT_PULLUP
      inverted: true
    internal: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: adjust_setpoint_down

### ═══════════════════════════════════════════════════════════════════════════
### BUTTONS — manual control actions exposed to Home Assistant
### ═══════════════════════════════════════════════════════════════════════════
### Pump buttons act as TOGGLES: press once to turn on (starts auto-off
### countdown), press again to turn off immediately. The auto-off timer
### duration is set by the "Pump Auto-Off Timer" number input.
###
### Safety guards at every turn-off point (both toggle-off and auto-off):
###   P1 Low:  Won't turn off if virtual heater is active (needs flow)
###   P1 High: Restores P1 Low if virtual heater was running (interlock
###            killed Low when High started — restore it when jets end)
###   P2 High: Won't turn off if a filter cycle is running

button:
  ### ── Pump Control Buttons (toggle + auto-off timer) ───────────────────

  ### Toggles Pump 1 Low. If off → on + auto-off timer. If on → off.
  ### Guard: won't turn off if virtual heater is active (needs flow).
  - platform: template
    name: "Pump 1 Low"
    icon: "mdi:pump"
    on_press:
      - script.execute: manual_p1_low

  ### Toggles Pump 1 High (jets). If off → on + auto-off timer. If on → off.
  ### Guard: restores P1 Low if virtual heater was running.
  - platform: template
    name: "Pump 1 High (Jets)"
    icon: "mdi:waves-arrow-up"
    on_press:
      - script.execute: manual_p1_high

  ### Toggles Pump 2 High. If off → on + auto-off timer. If on → off.
  ### Guard: won't turn off if filter cycle is running.
  - platform: template
    name: "Pump 2 High"
    icon: "mdi:water-pump"
    on_press:
      - script.execute: manual_p2_high

  ### ── System Buttons ───────────────────────────────────────────────────

  ### Clears the high-temperature alarm and hi-limit triggered flags,
  ### allowing the thermostat to resume heating. Only press this after
  ### verifying the over-temp condition has been resolved.
  - platform: template
    name: "Reset Hi-Limit"
    icon: "mdi:restart-alert"
    on_press:
      - logger.log: "Manual hi-limit reset triggered by user."
      - globals.set:
          id: high_temp_alarm
          value: "false"
      - globals.set:
          id: hi_limit_triggered
          value: "false"
      - homeassistant.service:
          service: persistent_notification.create
          data:
            title: "Spa Controller — Hi-Limit Reset"
            message: "Hi-Limit alarm has been manually reset. Heating can resume."

  ### Re-runs the full startup self-test sequence. Use this after a boot
  ### failure has been investigated and corrected.
  - platform: template
    name: "Retry Startup Test"
    icon: "mdi:test-tube"
    on_press:
      - logger.log: "Manual startup test retry triggered by user."
      - script.execute: startup_test_sequence

  ### Manually triggers a filter cycle (bypasses the interval timer).
  ### Ignored if a filter cycle is already running.
  - platform: template
    name: "Run Filter Cycle"
    icon: "mdi:air-filter"
    on_press:
      - script.execute: manual_filter_cycle

### ═══════════════════════════════════════════════════════════════════════════
### TEXT SENSORS — filter cycle timers displayed in hh:mm format
### ═══════════════════════════════════════════════════════════════════════════

text_sensor:
  ### Shows time remaining in the current filter cycle, or 00:00 if idle.
  - platform: template
    name: "Filter Cycle Remaining"
    update_interval: 30s
    lambda: |-
      if (!id(filter_running)) return std::string("00:00");
      uint32_t now = millis();
      uint32_t started = id(filter_last_run_time);
      uint32_t total_ms = id(filter_runtime_minutes) * 60000U;
      uint32_t elapsed = now - started;
      if (elapsed >= total_ms) return std::string("00:00");
      uint32_t remain_ms = total_ms - elapsed;
      uint32_t remain_min = remain_ms / 60000U;
      char buf[6];
      snprintf(buf, sizeof(buf), "%02d:%02d", (int)(remain_min / 60), (int)(remain_min % 60));
      return std::string(buf);

  ### Shows time until the next automatic filter cycle starts.
  - platform: template
    name: "Next Filter Cycle"
    update_interval: 30s
    lambda: |-
      if (!id(filter_cycle_enabled)) return std::string("00:00");
      uint32_t now = millis();
      uint32_t next_start = id(filter_last_run_time) + id(filter_interval_minutes) * 60000U;
      if (now >= next_start) return std::string("00:00");
      uint32_t remain_ms = next_start - now;
      uint32_t remain_min = remain_ms / 60000U;
      char buf[6];
      snprintf(buf, sizeof(buf), "%02d:%02d", (int)(remain_min / 60), (int)(remain_min % 60));
      return std::string(buf);

### ═══════════════════════════════════════════════════════════════════════════
### NUMBER INPUTS — user-adjustable parameters (all mode: box)
### ═══════════════════════════════════════════════════════════════════════════

number:
  ### Heater test pulse duration — controls how long the heater runs in
  ### Step 3 before the rise check. Clamped to 6000 ms max in the test
  ### script as a safety backstop.
  - platform: template
    name: "Heater Test Pulse (ms)"
    id: heater_pulse_number
    min_value: 500
    max_value: 6000
    step: 100
    mode: box
    unit_of_measurement: "ms"
    set_action:
      - globals.set:
          id: heater_pulse_ms
          value: !lambda "return (uint32_t)x;"
    lambda: "return (float)id(heater_pulse_ms);"

  ### Spa temperature calibration offset — additive correction applied
  ### to the raw NTC reading. Positive = reads warmer.
  - platform: template
    name: "Spa Temp Offset"
    id: spa_temp_offset_number
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    set_action:
      - globals.set:
          id: spa_temp_offset
          value: !lambda "return x;"
    lambda: "return id(spa_temp_offset);"

  ### Pump auto-off timer — how long a manually-activated pump runs before
  ### automatically shutting off. Only applies to pumps started via HA
  ### buttons, NOT pumps started by the thermostat or filter cycle.
  - platform: template
    name: "Pump Auto-Off Timer (minutes)"
    id: pump_auto_off_number
    min_value: 5
    max_value: 120
    step: 5
    mode: box
    unit_of_measurement: "min"
    set_action:
      - globals.set:
          id: pump_auto_off_minutes
          value: !lambda "return (uint32_t)x;"
    lambda: "return (float)id(pump_auto_off_minutes);"

  - platform: template
    name: "Filter Cycle Interval (minutes)"
    id: filter_interval_number
    min_value: 60
    max_value: 1440
    step: 10
    mode: box
    unit_of_measurement: "min"
    set_action:
      - globals.set:
          id: filter_interval_minutes
          value: !lambda "return (uint32_t)x;"
    lambda: "return (float)id(filter_interval_minutes);"

  - platform: template
    name: "Filter Cycle Runtime (minutes)"
    id: filter_runtime_number
    min_value: 1
    max_value: 120
    step: 1
    mode: box
    unit_of_measurement: "min"
    set_action:
      - globals.set:
          id: filter_runtime_minutes
          value: !lambda "return (uint32_t)x;"
    lambda: "return (float)id(filter_runtime_minutes);"

### ═══════════════════════════════════════════════════════════════════════════
### SCRIPTS — automation logic
### ═══════════════════════════════════════════════════════════════════════════

script:

  ###########################################################################
  ### MANUAL PUMP SCRIPTS — toggle on/off with auto-off safety timer
  ### Each pump has TWO scripts:
  ###   manual_pX       — TOGGLE logic. Checks pump state:
  ###                      OFF → turn on + start timer script
  ###                      ON  → turn off immediately + stop timer script
  ###   manual_pX_timer — AUTO-OFF countdown. Uses mode: restart so that
  ###                      if the pump is toggled off and back on, the
  ###                      timer resets cleanly.
  ### This separation keeps the toggle instant (no delay blocking) and the
  ### timer independently restartable.
  ###
  ### Safety guards at every turn-off point (both toggle-off and auto-off):
  ###   P1 Low:  Won't turn off if virtual heater is active (needs flow)
  ###   P1 High: Restores P1 Low if virtual heater was running (interlock
  ###            killed Low when High started — restore it when jets end)
  ###   P2 High: Won't turn off if a filter cycle is running
  ###########################################################################

  ### ── Pump 1 Low (toggle + auto-off) ────────────────────────────────────
  ### Toggle: if off → turn on + start timer. If on → turn off immediately.
  ### Guard at turn-off: if virtual_heater is on, the heater needs P1 Low
  ### for flow — do NOT turn it off. The thermostat will manage shutdown.
  - id: manual_p1_low
    then:
      - if:
          condition:
            lambda: "return id(r_P1_low).state;"
          then:
            ## Pump is ON — turn it off (with heater guard)
            - if:
                condition:
                  lambda: "return !id(virtual_heater).state;"
                then:
                  - script.stop: manual_p1_low_timer
                  - switch.turn_off: r_P1_low
                  - logger.log: "Manual Pump 1 Low OFF — user toggled off."
                else:
                  - logger.log: "Manual Pump 1 Low OFF BLOCKED — virtual heater is active."
          else:
            ## Pump is OFF — turn it on + start auto-off timer
            - logger.log:
                format: "Manual Pump 1 Low ON — auto-off in %u minutes"
                args: ["id(pump_auto_off_minutes)"]
            - switch.turn_on: r_P1_low
            - script.execute: manual_p1_low_timer

  ### Auto-off timer for Pump 1 Low. mode: restart so re-toggling resets it.
  - id: manual_p1_low_timer
    mode: restart
    then:
      - delay: !lambda "return id(pump_auto_off_minutes) * 60000U;"
      - if:
          condition:
            lambda: "return !id(virtual_heater).state;"
          then:
            - switch.turn_off: r_P1_low
            - logger.log: "Manual Pump 1 Low auto-off — timer expired."
          else:
            - logger.log: "Manual Pump 1 Low auto-off SKIPPED — virtual heater is active."

  ### ── Pump 1 High / Jets (toggle + auto-off) ────────────────────────────
  ### Toggle: if off → turn on + start timer. If on → turn off immediately.
  ### The GPIO interlock automatically turns off P1 Low when P1 High starts.
  ### Guard at turn-off: if the virtual heater is on, the interlock killed
  ### P1 Low when jets started — restore P1 Low to maintain heater flow.
  - id: manual_p1_high
    then:
      - if:
          condition:
            lambda: "return id(r_P1_high).state;"
          then:
            ## Jets are ON — turn them off
            - script.stop: manual_p1_high_timer
            - switch.turn_off: r_P1_high
            - logger.log: "Manual Pump 1 High OFF — user toggled off."
            ## If the heater was running, the interlock killed P1 Low when
            ## jets started. Restore P1 Low to maintain heater flow.
            - if:
                condition:
                  lambda: "return id(virtual_heater).state;"
                then:
                  - switch.turn_on: r_P1_low
                  - logger.log: "Restored Pump 1 Low — virtual heater is active."
          else:
            ## Jets are OFF — turn them on + start auto-off timer
            - logger.log:
                format: "Manual Pump 1 High (Jets) ON — auto-off in %u minutes"
                args: ["id(pump_auto_off_minutes)"]
            - switch.turn_on: r_P1_high
            - script.execute: manual_p1_high_timer

  ### Auto-off timer for Pump 1 High. mode: restart so re-toggling resets it.
  - id: manual_p1_high_timer
    mode: restart
    then:
      - delay: !lambda "return id(pump_auto_off_minutes) * 60000U;"
      - switch.turn_off: r_P1_high
      - logger.log: "Manual Pump 1 High auto-off — timer expired."
      ## If the heater was running, restore P1 Low for flow.
      - if:
          condition:
            lambda: "return id(virtual_heater).state;"
          then:
            - switch.turn_on: r_P1_low
            - logger.log: "Restored Pump 1 Low — virtual heater is active."

  ### ── Pump 2 High (toggle + auto-off) ───────────────────────────────────
  ### Toggle: if off → turn on + start timer. If on → turn off immediately.
  ### Guard at turn-off: if a filter cycle is running, the filter script
  ### manages its own shutdown — do NOT turn off P2 High.
  - id: manual_p2_high
    then:
      - if:
          condition:
            lambda: "return id(r_P2_high).state;"
          then:
            ## Pump is ON — turn it off (with filter guard)
            - if:
                condition:
                  lambda: "return !id(filter_running);"
                then:
                  - script.stop: manual_p2_high_timer
                  - switch.turn_off: r_P2_high
                  - logger.log: "Manual Pump 2 High OFF."
                else:
                  - logger.log: "Manual Pump 2 High OFF BLOCKED — filter active."
          else:
            ## Pump is OFF — turn it on + start auto-off timer
            - logger.log:
                format: "Manual Pump 2 High ON — auto-off in %u min"
                args: ["id(pump_auto_off_minutes)"]
            - switch.turn_on: r_P2_high
            - script.execute: manual_p2_high_timer

  ### Auto-off timer for Pump 2 High. mode: restart so re-toggling resets it.
  - id: manual_p2_high_timer
    mode: restart
    then:
      - delay: !lambda "return id(pump_auto_off_minutes) * 60000U;"
      - if:
          condition:
            lambda: "return !id(filter_running);"
          then:
            - switch.turn_off: r_P2_high
            - logger.log: "Manual Pump 2 High auto-off expired."
          else:
            - logger.log: "Manual Pump 2 High auto-off SKIPPED — filter active."

  ###########################################################################
  ### FACEPLATE SCRIPTS — physical button handlers
  ###########################################################################

  ### P1 cycle: Off → Low → High → Off
  - id: faceplate_p1_cycle
    then:
      - if:
          condition:
            lambda: "return id(r_P1_high).state;"
          then:
            - script.stop: manual_p1_high_timer
            - switch.turn_off: r_P1_high
            - logger.log: "Faceplate P1: High -> OFF"
            - if:
                condition:
                  lambda: "return id(virtual_heater).state;"
                then:
                  - switch.turn_on: r_P1_low
                  - logger.log: "Restored P1 Low — heater active."
          else:
            - if:
                condition:
                  lambda: "return id(r_P1_low).state;"
                then:
                  - script.stop: manual_p1_low_timer
                  - switch.turn_on: r_P1_high
                  - script.execute: manual_p1_high_timer
                  - logger.log: "Faceplate P1: Low -> High"
                else:
                  - switch.turn_on: r_P1_low
                  - script.execute: manual_p1_low_timer
                  - logger.log: "Faceplate P1: Off -> Low"

  ### P2 cycle: Off ↔ High  (P2 Low not supported by current motor)
  - id: faceplate_p2_cycle
    then:
      - if:
          condition:
            lambda: "return id(r_P2_high).state;"
          then:
            - if:
                condition:
                  lambda: "return id(filter_running);"
                then:
                  - logger.log: "Faceplate P2 OFF BLOCKED — filter active."
                else:
                  - script.stop: manual_p2_high_timer
                  - switch.turn_off: r_P2_high
                  - logger.log: "Faceplate P2: High -> OFF"
          else:
            - switch.turn_on: r_P2_high
            - script.execute: manual_p2_high_timer
            - logger.log: "Faceplate P2: Off -> High"

  ### Setpoint +1°F
  - id: adjust_setpoint_up
    then:
      - lambda: |-
          float t = id(spa_thermostat).target_temperature + 0.5556f;
          if (t > 40.6f) t = 40.6f;
          auto call = id(spa_thermostat).make_call();
          call.set_target_temperature(t);
          call.perform();
          ESP_LOGI("faceplate", "Setpoint UP -> %.1f C", t);

  ### Setpoint −1°F
  - id: adjust_setpoint_down
    then:
      - lambda: |-
          float t = id(spa_thermostat).target_temperature - 0.5556f;
          if (t < 5.0f) t = 5.0f;
          auto call = id(spa_thermostat).make_call();
          call.set_target_temperature(t);
          call.perform();
          ESP_LOGI("faceplate", "Setpoint DOWN -> %.1f C", t);

  ### Config mode placeholder (hold P1 + Temp Down for 10s)
  - id: enter_config_mode
    then:
      - logger.log: "CONFIG MODE ENTERED (placeholder)"
      - globals.set:
          id: config_mode
          value: "true"

  ###########################################################################
  ### STARTUP TEST ABORT — kill everything, set failure flags
  ###########################################################################
  - id: startup_test_abort
    then:
      - logger.log: "!!! STARTUP TEST FAILED — ABORTING — ALL OUTPUTS OFF !!!"
      - output.turn_off: r_Heater
      - output.turn_off: r_HiLim_1
      - output.turn_off: r_HiLim_2
      - switch.turn_off: r_P1_low
      - switch.turn_off: r_P1_high
      - switch.turn_off: r_Circ
      - switch.turn_off: r_P2_high
      - globals.set:
          id: boot_failed
          value: "true"
      - globals.set:
          id: boot_testing_active
          value: "false"
      - globals.set:
          id: startup_test_complete
          value: "false"
      - homeassistant.service:
          service: persistent_notification.create
          data:
            title: "Spa Controller — BOOT FAILED"
            message: "Startup test failed. All outputs disabled. Manual intervention required."

  ###########################################################################
  ### STARTUP TEST SEQUENCE — main entry point (called on_boot)
  ###########################################################################
  - id: startup_test_sequence
    then:
      - switch.turn_off: r_P2_low_reserved
      - logger.log: "=========================================="
      - logger.log: " Starting Spa Controller Startup Test"
      - logger.log: "=========================================="
      - globals.set:
          id: boot_testing_active
          value: "true"
      - globals.set:
          id: boot_failed
          value: "false"

      ### Ensure every output is OFF — we need stagnant water in the manifold.
      - output.turn_off: r_Heater
      - output.turn_off: r_HiLim_1
      - output.turn_off: r_HiLim_2
      - switch.turn_off: r_P1_low
      - switch.turn_off: r_P1_high
      - switch.turn_off: r_Circ
      - switch.turn_off: r_P2_high
      - logger.log: "All outputs OFF. Waiting for sensors to stabilize..."
      - delay: 3s

      ### Prime sensor filter chains (median window 5 + EMA alpha 0.15)
      - component.update: outlet_sensor
      - component.update: inlet_sensor
      - component.update: spa_sensor
      - delay: 2s
      - component.update: outlet_sensor
      - component.update: inlet_sensor
      - component.update: spa_sensor
      - delay: 2s
      - component.update: outlet_sensor
      - component.update: inlet_sensor
      - component.update: spa_sensor
      - delay: 2s
      - component.update: outlet_sensor
      - component.update: inlet_sensor
      - component.update: spa_sensor
      - delay: 2s
      - component.update: outlet_sensor
      - component.update: inlet_sensor
      - component.update: spa_sensor
      - delay: 1s

      ### Validate sensors
      - if:
          condition:
            and:
              - sensor.in_range:
                  id: inlet_temp
                  above: -10
                  below: 100
              - sensor.in_range:
                  id: outlet_temp
                  above: -10
                  below: 100
          then:
            - logger.log:
                format: "Sensors valid — Inlet: %.2f°C Outlet: %.2f°C Spa: %.2f°C"
                args: ["id(inlet_temp).state", "id(outlet_temp).state", "id(spa_temp).state"]
            - logger.log:
                format: "Heater pulse duration: %u ms"
                args: ["id(heater_pulse_ms)"]
            - script.execute: static_heater_test
          else:
            - logger.log: "ERROR: Temperature sensors out of range or NaN. Aborting."
            - script.execute: startup_test_abort

###########################################################################
  ### STARTUP TEST — static heater + pump-flush hi-limit break verification
  ### Step 1: Hi-Limit 1 ON only -> NO heat (circuit incomplete)
  ### Step 2: Both Hi-Limits ON, Heater OFF -> NO heat (heater relay open)
  ### Step 3: Full circuit, Heater ON (pulse) -> RISE expected
  ###         HL1 opened immediately after pulse to stop heating.
  ###         Heater relay STAYS ON for break tests.
  ### Step 4: HL1 already open from Step 3. Pump flush, stagnant check.
  ###         Verifies HL1 breaks the circuit.
  ### Step 5: Close HL1, Open HL2. Pump flush, stagnant check.
  ###         Verifies HL2 breaks the circuit.
  ###########################################################################
  - id: static_heater_test
    then:
      - logger.log: "=== STARTUP TEST BEGIN ==="

      ### ── Record stagnant baseline ──────────────────────────────────────
      - component.update: outlet_sensor
      - component.update: inlet_sensor
      - delay: 1s
      - globals.set:
          id: heater_temp_baseline_outlet
          value: !lambda "return id(outlet_temp).state;"
      - globals.set:
          id: heater_temp_baseline_inlet
          value: !lambda "return id(inlet_temp).state;"
      - logger.log:
          format: "Stagnant baseline — Inlet: %.2f°C Outlet: %.2f°C"
          args: ["id(heater_temp_baseline_inlet)", "id(heater_temp_baseline_outlet)"]

      ### ── STEP 1: Hi-Limit 1 ON only — NO heat ─────────────────────────
      - if:
          condition:
            lambda: "return !id(boot_failed);"
          then:
            - logger.log: "Step 1: Hi-Limit 1 ON only (circuit incomplete). No heat expected."
            - output.turn_on: r_HiLim_1
            - delay: 5s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - logger.log:
                format: " Step 1 — Outlet: %.2f°C (baseline: %.2f°C)"
                args: ["id(outlet_temp).state", "id(heater_temp_baseline_outlet)"]
      - if:
          condition:
            lambda: |-
              return !id(boot_failed) &&
                     fabs(id(outlet_temp).state - id(heater_temp_baseline_outlet)) > id(temp_deadband);
          then:
            - logger.log: "FAIL Step 1: Unexpected temp change with only Hi-Limit 1."
            - script.execute: startup_test_abort
      - if:
          condition:
            lambda: "return !id(boot_failed);"
          then:
            - logger.log: " Step 1 PASSED"

      ### ── STEP 2: Both Hi-Limits ON, Heater OFF — NO heat ──────────────
      - if:
          condition:
            lambda: "return !id(boot_failed);"
          then:
            - logger.log: "Step 2: Both Hi-Limits ON, Heater relay OFF. No heat expected."
            - output.turn_on: r_HiLim_2
            - delay: 5s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - logger.log:
                format: " Step 2 — Outlet: %.2f°C (baseline: %.2f°C)"
                args: ["id(outlet_temp).state", "id(heater_temp_baseline_outlet)"]
      - if:
          condition:
            lambda: |-
              return !id(boot_failed) &&
                     fabs(id(outlet_temp).state - id(heater_temp_baseline_outlet)) > id(temp_deadband);
          then:
            - logger.log: "FAIL Step 2: Unexpected temp change with Hi-Limits only."
            - script.execute: startup_test_abort
      - if:
          condition:
            lambda: "return !id(boot_failed);"
          then:
            - logger.log: " Step 2 PASSED"

      ### ── STEP 3: FULL CIRCUIT — heater pulse, then HL1 opens ──────────
      ### Heater fires for pulse duration into stagnant water. HL1 opens
      ### IMMEDIATELY after pulse to stop heating. Read windows measure
      ### residual heat only — no risk of runaway. Heater relay stays ON
      ### for hi-limit break verification in Steps 4 & 5.
      - if:
          condition:
            lambda: "return !id(boot_failed);"
          then:
            - logger.log:
                format: "Step 3: HEATER ON — %u ms into stagnant water. RISE EXPECTED."
                args: ["id(heater_pulse_ms)"]
            - globals.set:
                id: heater_temp_baseline_outlet
                value: !lambda "return id(outlet_temp).state;"
            - output.turn_on: r_Heater
            - delay: !lambda "return std::min(id(heater_pulse_ms), (uint32_t)6000);"

            ## Immediately break the circuit — stop heating
            - output.turn_off: r_HiLim_1
            - logger.log: " Pulse complete. HL1 opened — circuit broken. Heater relay stays ON."
            - logger.log: " Reading residual heat on outlet..."

            ## ── First read window (no active heating) ───────────────────
            - delay: 3s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - logger.log:
                format: " Step 3 window 1 — Outlet: %.2f°C (baseline: %.2f°C, delta: +%.2f°C)"
                args:
                  - "id(outlet_temp).state"
                  - "id(heater_temp_baseline_outlet)"
                  - "id(outlet_temp).state - id(heater_temp_baseline_outlet)"

      - if:
          condition:
            lambda: "return !id(boot_failed) && id(outlet_temp).state > 50.0;"
          then:
            - logger.log: "SAFETY ABORT: Outlet exceeded 50°C!"
            - script.execute: startup_test_abort

      - if:
          condition:
            lambda: |-
              return !id(boot_failed) &&
                     (id(outlet_temp).state - id(heater_temp_baseline_outlet)) < 0.5;
          then:
            - logger.log: " Rise not yet detected — retrying with second read window..."
            ## ── Second read window (still no active heating) ────────────
            - delay: 3s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - logger.log:
                format: " Step 3 window 2 — Outlet: %.2f°C (baseline: %.2f°C, delta: +%.2f°C)"
                args:
                  - "id(outlet_temp).state"
                  - "id(heater_temp_baseline_outlet)"
                  - "id(outlet_temp).state - id(heater_temp_baseline_outlet)"

      - if:
          condition:
            lambda: "return !id(boot_failed) && id(outlet_temp).state > 50.0;"
          then:
            - logger.log: "SAFETY ABORT: Outlet exceeded 50°C during retry!"
            - script.execute: startup_test_abort

      - if:
          condition:
            lambda: |-
              return !id(boot_failed) &&
                     (id(outlet_temp).state - id(heater_temp_baseline_outlet)) < 0.5;
          then:
            - logger.log: "FAIL Step 3: No temperature rise — heater not firing."
            - script.execute: startup_test_abort

      - if:
          condition:
            lambda: "return !id(boot_failed);"
          then:
            - logger.log: " Step 3 PASSED — Heater relay confirmed functional."
            - logger.log: " HL1 open, heater relay ON — ready for break tests."

      ### ── STEP 4: HI-LIMIT 1 BREAK TEST ────────────────────────────────
      ### HL1 is already open from Step 3. Heater relay still ON.
      ### Pump flush clears residual heat, then stagnant check verifies
      ### HL1 is actually breaking the circuit.
      - if:
          condition:
            lambda: "return !id(boot_failed);"
          then:
            - logger.log: "Step 4: HL1 already open. Heater relay still ON. Pump flush 15s."
            - switch.turn_on: r_P1_high
            - logger.log: " Pump 1 High ON — flushing manifold..."
            - delay: 15s
            - switch.turn_off: r_P1_high
            - logger.log: " Pump OFF. Water stagnant. Heater relay ON, HL1 open."
            - delay: 5s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - globals.set:
                id: heater_temp_baseline_outlet
                value: !lambda "return id(outlet_temp).state;"
            - logger.log:
                format: " Step 4 post-flush baseline — Outlet: %.2f°C"
                args: ["id(heater_temp_baseline_outlet)"]
            - delay: 10s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - logger.log:
                format: " Step 4 — Outlet: %.2f°C (baseline: %.2f°C, delta: %+.2f°C)"
                args:
                  - "id(outlet_temp).state"
                  - "id(heater_temp_baseline_outlet)"
                  - "id(outlet_temp).state - id(heater_temp_baseline_outlet)"

      - if:
          condition:
            lambda: |-
              return !id(boot_failed) &&
                     (id(outlet_temp).state - id(heater_temp_baseline_outlet)) > id(temp_deadband);
          then:
            - logger.log: "FAIL Step 4: Temp rose with HL1 OPEN — relay NOT breaking circuit!"
            - script.execute: startup_test_abort

      - if:
          condition:
            lambda: "return !id(boot_failed);"
          then:
            - logger.log: " Step 4 PASSED — Hi-Limit 1 confirmed breaking heater circuit."

      ### ── STEP 5: HI-LIMIT 2 BREAK TEST ────────────────────────────────
      ### Safe swap: open HL2 first (HL1 still open), then close HL1.
      ### Circuit is NEVER complete during the swap.
      - if:
          condition:
            lambda: "return !id(boot_failed);"
          then:
            - logger.log: "Step 5: Hi-Limit 2 OPEN, Hi-Limit 1 CLOSE. Heater still ON. Pump flush 15s."
            - output.turn_off: r_HiLim_2
            - delay: 200ms
            - output.turn_on: r_HiLim_1
            - delay: 500ms
            - switch.turn_on: r_P1_high
            - logger.log: " Pump 1 High ON — flushing manifold..."
            - delay: 15s
            - switch.turn_off: r_P1_high
            - logger.log: " Pump OFF. Water stagnant. Heater relay ON, HL2 open."
            - delay: 5s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - globals.set:
                id: heater_temp_baseline_outlet
                value: !lambda "return id(outlet_temp).state;"
            - logger.log:
                format: " Step 5 post-flush baseline — Outlet: %.2f°C"
                args: ["id(heater_temp_baseline_outlet)"]
            - delay: 10s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - logger.log:
                format: " Step 5 — Outlet: %.2f°C (baseline: %.2f°C, delta: %+.2f°C)"
                args:
                  - "id(outlet_temp).state"
                  - "id(heater_temp_baseline_outlet)"
                  - "id(outlet_temp).state - id(heater_temp_baseline_outlet)"

      - if:
          condition:
            lambda: |-
              return !id(boot_failed) &&
                     (id(outlet_temp).state - id(heater_temp_baseline_outlet)) > id(temp_deadband);
          then:
            - logger.log: "FAIL Step 5: Temp rose with HL2 OPEN — relay NOT breaking circuit!"
            - script.execute: startup_test_abort

      - if:
          condition:
            lambda: "return !id(boot_failed);"
          then:
            - logger.log: " Step 5 PASSED — Hi-Limit 2 confirmed breaking heater circuit."

      ### ── SHUTDOWN + TEST COMPLETE ──────────────────────────────────────
      - if:
          condition:
            lambda: "return !id(boot_failed);"
          then:
            - logger.log: "Shutting down all test outputs..."
            - output.turn_off: r_Heater
            - output.turn_off: r_HiLim_1
            - output.turn_off: r_HiLim_2
            - switch.turn_off: r_P1_high
            - delay: 1s
            - logger.log: ""
            - logger.log: ""
            - logger.log: "  ALL STARTUP TESTS PASSED — System Ready"
            - logger.log: ""
            - logger.log: "  Heater relay:        verified"
            - logger.log: "  Hi-Limit 1 cutout:   verified"
            - logger.log: "  Hi-Limit 2 cutout:   verified"
            - logger.log: "  Water flow:          verified (pump flushes)"
            - logger.log: "=========================================="
            - globals.set:
                id: startup_test_complete
                value: "true"
            - globals.set:
                id: boot_testing_active
                value: "false"
            - switch.turn_on: r_Circ
            - homeassistant.service:
                service: persistent_notification.create
                data:
                  title: "Spa Controller Startup Complete"
                  message: "Heater relay, both hi-limit cutouts, and water flow verified. System ready."

  ###########################################################################
  ### HIGH TEMPERATURE ALARM — runtime safety cutoff
  ### Pumps STAY RUNNING during alarm for circulation cooling.
  ###########################################################################
  - id: check_high_temp_alarm
    then:
      - if:
          condition:
            or:
              - sensor.in_range:
                  id: inlet_temp
                  above: 42.0
              - sensor.in_range:
                  id: outlet_temp
                  above: 42.0
              - sensor.in_range:
                  id: spa_temp
                  above: 42.0
          then:
            - if:
                condition:
                  lambda: "return !id(high_temp_alarm);"
                then:
                  - logger.log:
                      format: "CRITICAL: High temp alarm! Inlet: %.1f°C, Outlet: %.1f°C, Spa: %.1f°C"
                      args: ["id(inlet_temp).state", "id(outlet_temp).state", "id(spa_temp).state"]
                  - globals.set:
                      id: high_temp_alarm
                      value: "true"
                  - globals.set:
                      id: hi_limit_triggered
                      value: "true"
                  - output.turn_off: r_Heater
                  - output.turn_off: r_HiLim_1
                  - output.turn_off: r_HiLim_2
                  - lambda: "id(virtual_heater).publish_state(false);"
                  - homeassistant.service:
                      service: persistent_notification.create
                      data:
                        title: "Spa Controller — CRITICAL TEMPERATURE ALARM"
                        message: "Temperature exceeded 42°C. Heater disabled. Pumps still running. Manual reset required."
          else:
            - if:
                condition:
                  lambda: "return id(high_temp_alarm);"
                then:
                  - logger.log: "Temperature returned to safe range. High temp alarm cleared."
                  - globals.set:
                      id: high_temp_alarm
                      value: "false"

  ###########################################################################
  ### FILTER CYCLE — automatic periodic water filtration (uses P2 HIGH)
  ###########################################################################
  - id: filter_cycle_loop
    then:
      - if:
          condition:
            and:
              - lambda: "return id(filter_cycle_enabled);"
              - lambda: "return !id(filter_running);"
          then:
            - if:
                condition:
                  lambda: "return (millis() - id(filter_last_run_time)) > (id(filter_interval_minutes) * 60000U);"
                then:
                  - logger.log: "Starting automatic filter cycle (P2 High)"
                  - globals.set:
                      id: filter_running
                      value: "true"
                  - globals.set:
                      id: filter_last_run_time
                      value: !lambda "return millis();"
                  - switch.turn_on: r_P2_high
                  - delay: !lambda "return id(filter_runtime_minutes) * 60000U;"
                  - switch.turn_off: r_P2_high
                  - globals.set:
                      id: filter_running
                      value: "false"
                  - logger.log: "Automatic filter cycle complete"

  ###########################################################################
  ### MANUAL FILTER CYCLE — triggered by the "Run Filter Cycle" button
  ###########################################################################
  - id: manual_filter_cycle
    then:
      - if:
          condition:
            lambda: "return !id(filter_running);"
          then:
            - logger.log: "Manual filter cycle triggered (P2 High)"
            - globals.set:
                id: filter_running
                value: "true"
            - globals.set:
                id: filter_last_run_time
                value: !lambda "return millis();"
            - switch.turn_on: r_P2_high
            - delay: !lambda "return id(filter_runtime_minutes) * 60000U;"
            - switch.turn_off: r_P2_high
            - globals.set:
                id: filter_running
                value: "false"
            - logger.log: "Manual filter cycle complete"
          else:
            - logger.log: "Filter cycle already running — ignoring manual trigger."

### ═══════════════════════════════════════════════════════════════════════════
### INTERVALS — periodic background tasks
### ═══════════════════════════════════════════════════════════════════════════

interval:
  ### Normal sensor polling — only active AFTER boot test completes
  - interval: 5s
    then:
      - if:
          condition:
            lambda: "return !id(boot_testing_active);"
          then:
            - component.update: outlet_sensor
            - component.update: inlet_sensor
            - component.update: spa_sensor

  ### Filter cycle scheduler
  - interval: 60s
    then:
      - script.execute: filter_cycle_loop

  # ## ── LVGL Faceplate Refresh (every 2s) ─────────────────────────────────
  # - interval: 1s
  #   then:
