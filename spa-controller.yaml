## ═══════════════════════════════════════════════════════════════════════════
## GLOBALS — persistent and runtime state variables
## ═══════════════════════════════════════════════════════════════════════════

globals:

  ## ── Boot / Safety Flags ──────────────────────────────────────────────
  - id: startup_test_complete
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: high_temp_alarm
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: hi_limit_triggered
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: boot_testing_active
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: boot_failed
    type: bool
    restore_value: no
    initial_value: 'false'

  ## ── Heater Test Baselines ────────────────────────────────────────────
  - id: heater_temp_baseline_inlet
    type: float
    restore_value: no

  - id: heater_temp_baseline_outlet
    type: float
    restore_value: no

  ## ── Heater Test Pulse Duration ───────────────────────────────────────
  ## Duration in milliseconds for the initial heater-on period in Step 3.
  ## Tunable from HA without reflashing. Clamped to 6000 ms max in the
  ## test script regardless of what HA sends.
  - id: heater_pulse_ms
    type: uint32_t
    restore_value: yes
    initial_value: '2000'

  ## ── Spa Temperature Calibration ──────────────────────────────────────
  ## Additive offset applied to the raw NTC reading. Positive = reads
  ## warmer, negative = reads cooler. Persists across reboots.
  - id: spa_temp_offset
    type: float
    restore_value: yes
    initial_value: '0.0'

  ## ── Thermostat Tuning ────────────────────────────────────────────────
  - id: temp_deadband
    type: float
    restore_value: no
    initial_value: '0.5'

  ## ── Filter Cycle State (survives reboot) ─────────────────────────────
  - id: filter_last_run_time
    type: uint32_t
    restore_value: yes
    initial_value: '0'

  - id: filter_cycle_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'

  - id: filter_interval_minutes
    type: uint32_t
    restore_value: yes
    initial_value: '240'

  - id: filter_runtime_minutes
    type: uint32_t
    restore_value: yes
    initial_value: '60'

  ## True while a filter cycle (automatic or manual) is actively running.
  ## Used by the filter timer text sensors and to prevent overlapping runs.
  - id: filter_running
    type: bool
    restore_value: no
    initial_value: 'false'


## ═══════════════════════════════════════════════════════════════════════════
## OUTPUTS — heater safety relay GPIOs (not exposed to HA directly)
## ═══════════════════════════════════════════════════════════════════════════

output:

  ## Pin 2 — Hi-limit relay 1 (safety, series with heater)
  - platform: gpio
    pin: GPIO25
    inverted: false
    id: r_HiLim_1

  ## Pin 3 — Hi-limit relay 2 (safety, series with heater)
  - platform: gpio
    pin: GPIO26
    inverted: false
    id: r_HiLim_2

  ## Pin 4 — Heater coil relay (energises the heating element)
  - platform: gpio
    pin: GPIO13
    id: r_Heater
    inverted: false


## ═══════════════════════════════════════════════════════════════════════════
## SWITCHES — relay GPIOs exposed to Home Assistant
## ═══════════════════════════════════════════════════════════════════════════

switch:

  ## Pin 10 — Pump 1 low speed (used for heater flow)
  - platform: gpio
    pin: GPIO18
    id: r_P1_low
    inverted: false
    interlock: r_P1_high
    name: Pump 1 Low

  ## Pin 11 — Pump 1 high speed (jets)
  - platform: gpio
    pin: GPIO19
    id: r_P1_high
    inverted: false
    interlock: r_P1_low
    name: Pump 1 High

  ## Pin 13 — Circulator pump (low-flow circulation)
  - platform: gpio
    pin: GPIO32
    id: r_Circ
    inverted: false
    name: Circ Pump

  ## Pin 15 — Pump 2 high speed (used for filter cycle)
  - platform: gpio
    pin: GPIO22
    id: r_P2_high
    inverted: false
    name: Pump 2 High

  ## Virtual heater — the ONLY safe way to turn the heater on.
  - platform: template
    name: "Virtual Heater"
    id: virtual_heater
    optimistic: true
    turn_on_action:
      - output.turn_on: r_HiLim_1
      - output.turn_on: r_HiLim_2
      - delay: 500ms
      - switch.turn_on: r_P1_low
      - delay: 500ms
      - output.turn_on: r_Heater
    turn_off_action:
      - output.turn_off: r_Heater
      - delay: 500ms
      - switch.turn_off: r_P1_low
      - output.turn_off: r_HiLim_2
      - output.turn_off: r_HiLim_1


## ═══════════════════════════════════════════════════════════════════════════
## SENSORS — temperature measurement chain
## ═══════════════════════════════════════════════════════════════════════════

sensor:

  ## ── OUTLET TEMPERATURE (Pin 6 / GPIO35) ─────────────────────────────
  - platform: adc
    id: outlet_sensor
    pin: GPIO35
    update_interval: 2s
    name: Outlet Voltage
    attenuation: auto

  - platform: resistance
    id: outlet_resistance
    sensor: outlet_sensor
    configuration: DOWNSTREAM
    resistor: 9.0kOhm
    name: Outlet Resistance Sensor

  - platform: ntc
    sensor: outlet_resistance
    calibration:
      - 10.0kOhm -> 25°C
      - 32.665kOhm -> 0°C
      - 6.530kOhm -> 35°C
    id: outlet_temp
    name: Outlet Temperature
    filters:
      - median:
          window_size: 5
          send_every: 1
      - exponential_moving_average:
          alpha: 0.15
          send_every: 1
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(boot_testing_active);'
            then:
              - script.execute: check_high_temp_alarm

  ## ── INLET TEMPERATURE (Pin 5 / GPIO34) ──────────────────────────────
  - platform: adc
    id: inlet_sensor
    pin: GPIO34
    update_interval: 2s
    name: Inlet Voltage
    attenuation: auto

  - platform: resistance
    id: inlet_resistance
    sensor: inlet_sensor
    configuration: DOWNSTREAM
    resistor: 9.0kOhm
    name: Inlet Resistance Sensor

  - platform: ntc
    sensor: inlet_resistance
    calibration:
      - 10.0kOhm -> 25°C
      - 32.665kOhm -> 0°C
      - 6.530kOhm -> 35°C
    id: inlet_temp
    name: Inlet Temperature
    filters:
      - median:
          window_size: 5
          send_every: 1
      - exponential_moving_average:
          alpha: 0.15
          send_every: 1
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(boot_testing_active);'
            then:
              - script.execute: check_high_temp_alarm

  ## ── SPA / JACUZZI TEMPERATURE (Pin 7 / GPIO39) ──────────────────────
  ## NOTE: This sensor uses a 10.0 kOhm pull-down reference resistor
  ## with UPSTREAM NTC configuration, unlike the inlet/outlet
  ## which use 9.0 kOhm DOWNSTREAM. The resistor value must match
  ## what is physically on the board for accurate readings.
  - platform: adc
    id: spa_sensor
    pin: GPIO39
    update_interval: 10s
    name: Spa Voltage
    attenuation: auto

  - platform: resistance
    id: spa_resistance
    sensor: spa_sensor
    configuration: UPSTREAM
    resistor: 10.0kOhm
    name: Spa Resistance Sensor

  ## Raw NTC output — used as the source for the calibrated template sensor.
  ## Not hidden from HA so you can compare raw vs. corrected on a dashboard.
  - platform: ntc
    sensor: spa_resistance
    calibration:
      - 10.0kOhm -> 25°C
      - 32.665kOhm -> 0°C
      - 6.530kOhm -> 35°C
    id: spa_temp_raw
    name: Spa Temperature Raw
    filters:
      - median:
          window_size: 5
          send_every: 1
      - exponential_moving_average:
          alpha: 0.15
          send_every: 1

  ## Calibrated spa temperature — applies the user-adjustable offset from
  ## the spa_temp_offset global. This is the sensor referenced by the
  ## thermostat climate entity and the high-temp alarm.
  - platform: template
    name: "Spa Temperature"
    id: spa_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (isnan(id(spa_temp_raw).state)) return NAN;
      return id(spa_temp_raw).state + id(spa_temp_offset);


## ═══════════════════════════════════════════════════════════════════════════
## BINARY SENSORS — boolean status exposed to Home Assistant
## ═══════════════════════════════════════════════════════════════════════════

binary_sensor:

  - platform: template
    name: "Startup Test Complete"
    id: startup_test_complete_sensor
    lambda: 'return id(startup_test_complete);'

  - platform: template
    name: "High Temperature Alarm"
    id: high_temp_alarm_sensor
    lambda: 'return id(high_temp_alarm);'

  - platform: template
    name: "Hi-Limit Relay Triggered"
    id: hi_limit_triggered_sensor
    lambda: 'return id(hi_limit_triggered);'

  - platform: template
    name: "Boot Failed"
    id: boot_failed_sensor
    lambda: 'return id(boot_failed);'


## ═══════════════════════════════════════════════════════════════════════════
## BUTTONS — manual control actions exposed to Home Assistant
## ═══════════════════════════════════════════════════════════════════════════

button:

  ## Clears the high-temperature alarm and hi-limit triggered flags,
  ## allowing the thermostat to resume heating.
  - platform: template
    name: "Reset Hi-Limit"
    on_press:
      - logger.log: "Manual hi-limit reset triggered by user."
      - globals.set:
          id: high_temp_alarm
          value: 'false'
      - globals.set:
          id: hi_limit_triggered
          value: 'false'
      - homeassistant.service:
          service: persistent_notification.create
          data:
            title: "Spa Controller — Hi-Limit Reset"
            message: "Hi-Limit alarm has been manually reset. Heating can resume."

  ## Re-runs the full startup self-test sequence.
  - platform: template
    name: "Retry Startup Test"
    on_press:
      - logger.log: "Manual startup test retry triggered by user."
      - script.execute: startup_test_sequence

  ## Manually triggers a filter cycle.
  - platform: template
    name: "Run Filter Cycle"
    on_press:
      - script.execute: manual_filter_cycle


## ═══════════════════════════════════════════════════════════════════════════
## TEXT SENSORS — filter cycle timers displayed in hh:mm format
## ═══════════════════════════════════════════════════════════════════════════

text_sensor:

  ## Shows time remaining in the current filter cycle, or 00:00 if idle.
  - platform: template
    name: "Filter Cycle Remaining"
    update_interval: 30s
    lambda: |-
      if (!id(filter_running)) {
        return {"00:00"};
      }
      uint32_t now = millis();
      uint32_t started = id(filter_last_run_time);
      uint32_t total_ms = id(filter_runtime_minutes) * 60000U;
      uint32_t elapsed = now - started;
      if (elapsed >= total_ms) {
        return {"00:00"};
      }
      uint32_t remain_ms = total_ms - elapsed;
      uint32_t remain_min = remain_ms / 60000U;
      char buf[6];
      snprintf(buf, sizeof(buf), "%02d:%02d", (int)(remain_min / 60), (int)(remain_min % 60));
      return {buf};

  ## Shows time until the next automatic filter cycle starts.
  - platform: template
    name: "Next Filter Cycle"
    update_interval: 30s
    lambda: |-
      if (!id(filter_cycle_enabled)) {
        return {"00:00"};
      }
      uint32_t now = millis();
      uint32_t next_start = id(filter_last_run_time) + id(filter_interval_minutes) * 60000U;
      if (now >= next_start) {
        return {"00:00"};
      }
      uint32_t remain_ms = next_start - now;
      uint32_t remain_min = remain_ms / 60000U;
      char buf[6];
      snprintf(buf, sizeof(buf), "%02d:%02d", (int)(remain_min / 60), (int)(remain_min % 60));
      return {buf};


## ═══════════════════════════════════════════════════════════════════════════
## NUMBER INPUTS — user-adjustable parameters (all mode: box)
## ═══════════════════════════════════════════════════════════════════════════

number:

  ## Heater test pulse duration — controls how long the heater runs in
  ## Step 3 before the rise check. Clamped to 6000 ms max in the test
  ## script as a safety backstop.
  - platform: template
    name: "Heater Test Pulse (ms)"
    id: heater_pulse_number
    min_value: 500
    max_value: 6000
    step: 100
    mode: box
    unit_of_measurement: "ms"
    set_action:
      - globals.set:
          id: heater_pulse_ms
          value: !lambda 'return (uint32_t)x;'
    lambda: 'return (float)id(heater_pulse_ms);'

  ## Spa temperature calibration offset — additive correction applied
  ## to the raw NTC reading. Positive = reads warmer.
  - platform: template
    name: "Spa Temp Offset"
    id: spa_temp_offset_number
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    set_action:
      - globals.set:
          id: spa_temp_offset
          value: !lambda 'return x;'
    lambda: 'return id(spa_temp_offset);'

  - platform: template
    name: "Filter Cycle Interval (minutes)"
    id: filter_interval_number
    min_value: 60
    max_value: 1440
    step: 10
    mode: box
    unit_of_measurement: "min"
    set_action:
      - globals.set:
          id: filter_interval_minutes
          value: !lambda 'return (uint32_t)x;'
    lambda: 'return (float)id(filter_interval_minutes);'

  - platform: template
    name: "Filter Cycle Runtime (minutes)"
    id: filter_runtime_number
    min_value: 1
    max_value: 120
    step: 1
    mode: box
    unit_of_measurement: "min"
    set_action:
      - globals.set:
          id: filter_runtime_minutes
          value: !lambda 'return (uint32_t)x;'
    lambda: 'return (float)id(filter_runtime_minutes);'


## ═══════════════════════════════════════════════════════════════════════════
## SCRIPTS — automation logic
## ═══════════════════════════════════════════════════════════════════════════

script:

  ###########################################################################
  ## STARTUP TEST ABORT — kill everything, set failure flags
  ###########################################################################
  - id: startup_test_abort
    then:
      - logger.log: "!!! STARTUP TEST FAILED — ABORTING — ALL OUTPUTS OFF !!!"
      - output.turn_off: r_Heater
      - output.turn_off: r_HiLim_1
      - output.turn_off: r_HiLim_2
      - switch.turn_off: r_P1_low
      - switch.turn_off: r_P1_high
      - switch.turn_off: r_Circ
      - switch.turn_off: r_P2_high
      - globals.set:
          id: boot_failed
          value: 'true'
      - globals.set:
          id: boot_testing_active
          value: 'false'
      - globals.set:
          id: startup_test_complete
          value: 'false'
      - homeassistant.service:
          service: persistent_notification.create
          data:
            title: "Spa Controller — BOOT FAILED"
            message: "Startup test failed. All outputs disabled. Manual intervention required."


  ###########################################################################
  ## STARTUP TEST SEQUENCE — main entry point (called on_boot)
  ###########################################################################
  - id: startup_test_sequence
    then:
      - logger.log: "=========================================="
      - logger.log: " Starting Spa Controller Startup Test"
      - logger.log: "=========================================="
      - globals.set:
          id: boot_testing_active
          value: 'true'
      - globals.set:
          id: boot_failed
          value: 'false'

      ## Ensure every output is OFF before we begin — we need stagnant
      ## water in the heater manifold.
      - output.turn_off: r_Heater
      - output.turn_off: r_HiLim_1
      - output.turn_off: r_HiLim_2
      - switch.turn_off: r_P1_low
      - switch.turn_off: r_P1_high
      - switch.turn_off: r_Circ
      - switch.turn_off: r_P2_high

      - logger.log: "All outputs OFF. Waiting for sensors to stabilize..."
      - delay: 3s

      ## Prime the sensor filter chains with several manual reads.
      ## The median filter (window 5) and EMA (alpha 0.15) need data
      ## before they produce meaningful output.
      - component.update: outlet_sensor
      - component.update: inlet_sensor
      - component.update: spa_sensor
      - delay: 2s
      - component.update: outlet_sensor
      - component.update: inlet_sensor
      - component.update: spa_sensor
      - delay: 2s
      - component.update: outlet_sensor
      - component.update: inlet_sensor
      - component.update: spa_sensor
      - delay: 2s
      - component.update: outlet_sensor
      - component.update: inlet_sensor
      - component.update: spa_sensor
      - delay: 2s
      - component.update: outlet_sensor
      - component.update: inlet_sensor
      - component.update: spa_sensor
      - delay: 1s

      ## Validate sensors are returning sane values
      - if:
          condition:
            and:
              - sensor.in_range:
                  id: inlet_temp
                  above: -10
                  below: 100
              - sensor.in_range:
                  id: outlet_temp
                  above: -10
                  below: 100
          then:
            - logger.log:
                format: "Sensors valid — Inlet: %.2f°C  Outlet: %.2f°C  Spa: %.2f°C"
                args: ['id(inlet_temp).state', 'id(outlet_temp).state', 'id(spa_temp).state']
            - logger.log:
                format: "Heater pulse duration: %u ms"
                args: ['id(heater_pulse_ms)']
            - logger.log: "Proceeding to startup test..."
            - script.execute: static_heater_test
          else:
            - logger.log: "ERROR: Temperature sensors out of range or NaN. Aborting."
            - script.execute: startup_test_abort


  ###########################################################################
  ## STARTUP TEST — static heater + pump-flush hi-limit break verification
  ##
  ## All pumps remain OFF for Steps 1-3. The water trapped in the heater
  ## manifold is stagnant, so even a short heater pulse produces a large,
  ## easily-detected temperature rise on the outlet NTC sensor.
  ##
  ## After Step 3 proves the heater relay works, the heater relay STAYS ON
  ## for Steps 4-5. Each hi-limit is opened individually, then Pump 1 High
  ## flushes cool spa water through the manifold (15s), clearing all
  ## residual heat. After the pump stops the water is stagnant and cool.
  ## With the heater relay still energised, if the hi-limit ISN'T actually
  ## breaking the circuit, the stagnant water will heat up immediately —
  ## an unmistakable, definitive failure signal with zero thermal-lag
  ## ambiguity.
  ##
  ## The pump flushes also implicitly verify water flow — if the pump
  ## wasn't moving water, the manifold wouldn't cool down.
  ##
  ## Step 1: Hi-Limit 1 ON only            -> NO heat (circuit incomplete)
  ## Step 2: Both Hi-Limits ON, Heater OFF  -> NO heat (heater relay open)
  ## Step 3: Full circuit, Heater ON (pulse)-> RISE expected
  ##         Heater relay STAYS ON.
  ## Step 4: Open HL1, Pump flush 15s, pump off -> NO rise (HL1 breaks it)
  ## Step 5: Close HL1, Open HL2, Pump flush 15s, pump off -> NO rise
  ##
  ## Safety: 50 C hard abort on outlet at every check point.
  ## Rise threshold: 0.5 C minimum for heater-on steps.
  ###########################################################################
  - id: static_heater_test
    then:
      - logger.log: "=== STARTUP TEST BEGIN ==="

      ## ── Record stagnant baseline ──────────────────────────────────────
      - component.update: outlet_sensor
      - component.update: inlet_sensor
      - delay: 1s
      - globals.set:
          id: heater_temp_baseline_outlet
          value: !lambda 'return id(outlet_temp).state;'
      - globals.set:
          id: heater_temp_baseline_inlet
          value: !lambda 'return id(inlet_temp).state;'
      - logger.log:
          format: "Stagnant baseline — Inlet: %.2f°C  Outlet: %.2f°C"
          args: ['id(heater_temp_baseline_inlet)', 'id(heater_temp_baseline_outlet)']

      ## ── STEP 1: Hi-Limit 1 ON only — incomplete circuit, NO heat ─────
      - if:
          condition:
            lambda: 'return !id(boot_failed);'
          then:
            - logger.log: "Step 1: Hi-Limit 1 ON only (circuit incomplete). No heat expected."
            - output.turn_on: r_HiLim_1
            - delay: 5s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - logger.log:
                format: "  Step 1 — Outlet: %.2f°C (baseline: %.2f°C)"
                args: ['id(outlet_temp).state', 'id(heater_temp_baseline_outlet)']
      - if:
          condition:
            lambda: |-
              return !id(boot_failed) &&
              fabs(id(outlet_temp).state - id(heater_temp_baseline_outlet)) > id(temp_deadband);
          then:
            - logger.log: "FAIL Step 1: Unexpected temp change with only Hi-Limit 1."
            - script.execute: startup_test_abort
      - if:
          condition:
            lambda: 'return !id(boot_failed);'
          then:
            - logger.log: "  Step 1 PASSED"

      ## ── STEP 2: Both Hi-Limits ON, Heater OFF — NO heat ──────────────
      - if:
          condition:
            lambda: 'return !id(boot_failed);'
          then:
            - logger.log: "Step 2: Both Hi-Limits ON, Heater relay OFF. No heat expected."
            - output.turn_on: r_HiLim_2
            - delay: 5s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - logger.log:
                format: "  Step 2 — Outlet: %.2f°C (baseline: %.2f°C)"
                args: ['id(outlet_temp).state', 'id(heater_temp_baseline_outlet)']
      - if:
          condition:
            lambda: |-
              return !id(boot_failed) &&
              fabs(id(outlet_temp).state - id(heater_temp_baseline_outlet)) > id(temp_deadband);
          then:
            - logger.log: "FAIL Step 2: Unexpected temp change with Hi-Limits only (no heater)."
            - script.execute: startup_test_abort
      - if:
          condition:
            lambda: 'return !id(boot_failed);'
          then:
            - logger.log: "  Step 2 PASSED"

      ## ── STEP 3: FULL CIRCUIT — heater ON, RISE expected ───────────────
      ##    Both hi-limits are already ON from Steps 1-2.
      ##    Heater turns on, runs for heater_pulse_ms, then we check for
      ##    rise. HEATER STAYS ON — it is not turned off after the pulse.
      ##    "Check once, retry once" — if first window doesn't show enough
      ##    rise, the same delay + reads are repeated once more.
      - if:
          condition:
            lambda: 'return !id(boot_failed);'
          then:
            - logger.log:
                format: "Step 3: HEATER ON — %u ms into stagnant water. RISE EXPECTED."
                args: ['id(heater_pulse_ms)']
            ## Snapshot baseline right before heater on
            - globals.set:
                id: heater_temp_baseline_outlet
                value: !lambda 'return id(outlet_temp).state;'
            - output.turn_on: r_Heater
            - delay: !lambda 'return std::min(id(heater_pulse_ms), (uint32_t)6000);'
            ## NOTE: Heater stays ON — do NOT turn it off here.
            - logger.log: "  Pulse complete. Heater remains ON. Reading outlet..."
            ## ── First read window ───────────────────────────────────────
            - delay: 3s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - logger.log:
                format: "  Step 3 window 1 — Outlet: %.2f°C (baseline: %.2f°C, delta: +%.2f°C)"
                args: ['id(outlet_temp).state', 'id(heater_temp_baseline_outlet)', 'id(outlet_temp).state - id(heater_temp_baseline_outlet)']
      ## Safety abort
      - if:
          condition:
            lambda: 'return !id(boot_failed) && id(outlet_temp).state > 50.0;'
          then:
            - logger.log: "SAFETY ABORT: Outlet exceeded 50°C!"
            - script.execute: startup_test_abort
      ## Check rise — first attempt
      - if:
          condition:
            lambda: |-
              return !id(boot_failed) &&
              (id(outlet_temp).state - id(heater_temp_baseline_outlet)) < 0.5;
          then:
            ## Rise not detected yet — retry with second window.
            ## Heater is still ON, so temp is still climbing.
            - logger.log: "  Rise not yet detected — retrying with second read window..."
            - delay: 3s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - logger.log:
                format: "  Step 3 window 2 — Outlet: %.2f°C (baseline: %.2f°C, delta: +%.2f°C)"
                args: ['id(outlet_temp).state', 'id(heater_temp_baseline_outlet)', 'id(outlet_temp).state - id(heater_temp_baseline_outlet)']
            - if:
                condition:
                  lambda: 'return !id(boot_failed) && id(outlet_temp).state > 50.0;'
                then:
                  - logger.log: "SAFETY ABORT: Outlet exceeded 50°C during retry!"
                  - script.execute: startup_test_abort
            - if:
                condition:
                  lambda: |-
                    return !id(boot_failed) &&
                    (id(outlet_temp).state - id(heater_temp_baseline_outlet)) < 0.5;
                then:
                  - logger.log: "FAIL Step 3: No temperature rise after two windows — heater not firing."
                  - script.execute: startup_test_abort
      - if:
          condition:
            lambda: 'return !id(boot_failed);'
          then:
            - logger.log: "  Step 3 PASSED — Heater relay confirmed functional."
            - logger.log: "  Heater relay remains ON for hi-limit break tests."

      ## ── STEP 4: HI-LIMIT 1 BREAK TEST ────────────────────────────────
      ##    Heater relay is still ON from Step 3.
      ##    Open Hi-Limit 1 — circuit should break (no current to element).
      ##    Pump 1 High flushes cool spa water through the manifold for
      ##    15 seconds, clearing all residual heat from Step 3. After the
      ##    pump stops, the water is stagnant and cool. If Hi-Limit 1 is
      ##    actually breaking the circuit, the temp should NOT rise even
      ##    though the heater relay is still energised.
      - if:
          condition:
            lambda: 'return !id(boot_failed);'
          then:
            - logger.log: "Step 4: Hi-Limit 1 OPEN. Heater relay still ON. Pump flush 15s."
            - output.turn_off: r_HiLim_1
            - delay: 500ms
            ## Flush heated manifold water with cool spa water
            - switch.turn_on: r_P1_high
            - logger.log: "  Pump 1 High ON — flushing manifold..."
            - delay: 15s
            - switch.turn_off: r_P1_high
            - logger.log: "  Pump OFF. Water stagnant. Heater relay ON, HL1 open."
            ## Let flow settle, then prime sensor reads
            - delay: 5s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            ## Record post-flush baseline — should be near ambient/spa temp
            - globals.set:
                id: heater_temp_baseline_outlet
                value: !lambda 'return id(outlet_temp).state;'
            - logger.log:
                format: "  Step 4 post-flush baseline — Outlet: %.2f°C"
                args: ['id(heater_temp_baseline_outlet)']
            ## Wait 10s — if HL1 failed, stagnant water heats up fast
            - delay: 10s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - logger.log:
                format: "  Step 4 — Outlet: %.2f°C (baseline: %.2f°C, delta: %+.2f°C)"
                args: ['id(outlet_temp).state', 'id(heater_temp_baseline_outlet)', 'id(outlet_temp).state - id(heater_temp_baseline_outlet)']
      - if:
          condition:
            lambda: |-
              return !id(boot_failed) &&
              (id(outlet_temp).state - id(heater_temp_baseline_outlet)) > id(temp_deadband);
          then:
            - logger.log: "FAIL Step 4: Temp rose with Hi-Limit 1 OPEN — relay NOT breaking circuit!"
            - script.execute: startup_test_abort
      - if:
          condition:
            lambda: 'return !id(boot_failed);'
          then:
            - logger.log: "  Step 4 PASSED — Hi-Limit 1 confirmed breaking heater circuit."

      ## ── STEP 5: HI-LIMIT 2 BREAK TEST ────────────────────────────────
      ##    Heater relay is still ON.
      ##    Swap hi-limits: open HL2 FIRST (circuit stays broken via HL1
      ##    which is still open), THEN close HL1. At no point are both
      ##    hi-limits closed while the heater relay is on.
      ##    Same pump flush + stagnant check as Step 4.
      - if:
          condition:
            lambda: 'return !id(boot_failed);'
          then:
            - logger.log: "Step 5: Hi-Limit 2 OPEN, Hi-Limit 1 CLOSE. Heater relay still ON. Pump flush 15s."
            ## Safe transition — open HL2 first (HL1 still open), then close HL1
            - output.turn_off: r_HiLim_2
            - delay: 200ms
            - output.turn_on: r_HiLim_1
            - delay: 500ms
            ## Flush manifold again
            - switch.turn_on: r_P1_high
            - logger.log: "  Pump 1 High ON — flushing manifold..."
            - delay: 15s
            - switch.turn_off: r_P1_high
            - logger.log: "  Pump OFF. Water stagnant. Heater relay ON, HL2 open."
            ## Let flow settle, then prime sensor reads
            - delay: 5s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            ## Record post-flush baseline
            - globals.set:
                id: heater_temp_baseline_outlet
                value: !lambda 'return id(outlet_temp).state;'
            - logger.log:
                format: "  Step 5 post-flush baseline — Outlet: %.2f°C"
                args: ['id(heater_temp_baseline_outlet)']
            ## Wait 10s — if HL2 failed, stagnant water heats up fast
            - delay: 10s
            - component.update: outlet_sensor
            - delay: 1s
            - component.update: outlet_sensor
            - delay: 1s
            - logger.log:
                format: "  Step 5 — Outlet: %.2f°C (baseline: %.2f°C, delta: %+.2f°C)"
                args: ['id(outlet_temp).state', 'id(heater_temp_baseline_outlet)', 'id(outlet_temp).state - id(heater_temp_baseline_outlet)']
      - if:
          condition:
            lambda: |-
              return !id(boot_failed) &&
              (id(outlet_temp).state - id(heater_temp_baseline_outlet)) > id(temp_deadband);
          then:
            - logger.log: "FAIL Step 5: Temp rose with Hi-Limit 2 OPEN — relay NOT breaking circuit!"
            - script.execute: startup_test_abort
      - if:
          condition:
            lambda: 'return !id(boot_failed);'
          then:
            - logger.log: "  Step 5 PASSED — Hi-Limit 2 confirmed breaking heater circuit."

      ## ── SHUTDOWN + TEST COMPLETE ──────────────────────────────────────
      - if:
          condition:
            lambda: 'return !id(boot_failed);'
          then:
            - logger.log: "Shutting down all test outputs..."
            - output.turn_off: r_Heater
            - output.turn_off: r_HiLim_1
            - output.turn_off: r_HiLim_2
            - switch.turn_off: r_P1_high
            - delay: 1s
            - logger.log: ""
            - logger.log: "=========================================="
            - logger.log: "  ALL STARTUP TESTS PASSED — System Ready"
            - logger.log: "=========================================="
            - logger.log: "  Heater relay: verified"
            - logger.log: "  Hi-Limit 1 cutout: verified"
            - logger.log: "  Hi-Limit 2 cutout: verified"
            - logger.log: "  Water flow: verified (pump flushes)"
            - logger.log: "=========================================="
            - globals.set:
                id: startup_test_complete
                value: 'true'
            - globals.set:
                id: boot_testing_active
                value: 'false'
            ## Start the circulator pump now that we know everything works
            - switch.turn_on: r_Circ
            - homeassistant.service:
                service: persistent_notification.create
                data:
                  title: "Spa Controller Startup Complete"
                  message: "Heater relay, both hi-limit cutouts, and water flow verified. System ready."


  ###########################################################################
  ## HIGH TEMPERATURE ALARM — runtime safety cutoff
  ## NOTE: Pumps STAY RUNNING during a high-temp alarm to maintain water
  ## circulation and aid cool-down. Only the heater circuit is killed.
  ###########################################################################
  - id: check_high_temp_alarm
    then:
      - if:
          condition:
            or:
              - sensor.in_range:
                  id: inlet_temp
                  above: 42.0
              - sensor.in_range:
                  id: outlet_temp
                  above: 42.0
              - sensor.in_range:
                  id: spa_temp
                  above: 42.0
          then:
            - if:
                condition:
                  lambda: 'return !id(high_temp_alarm);'
                then:
                  - logger.log:
                      format: "CRITICAL: High temperature alarm! Inlet: %.1f°C, Outlet: %.1f°C, Spa: %.1f°C"
                      args: ['id(inlet_temp).state', 'id(outlet_temp).state', 'id(spa_temp).state']
                  - globals.set:
                      id: high_temp_alarm
                      value: 'true'
                  - globals.set:
                      id: hi_limit_triggered
                      value: 'true'
                  # Kill the heater circuit only — pumps stay running
                  - output.turn_off: r_Heater
                  - output.turn_off: r_HiLim_1
                  - output.turn_off: r_HiLim_2
                  #Turn off thermostat and virtual heater switch to prevent them from trying to turn the heater back on
                  - climate.control: 
                      id: spa_thermostat
                      mode: "OFF"
                  - switch.turn_off: virtual_heater
                  # Update virtual heater state without triggering turn_off_action
                  - lambda: 'id(virtual_heater).publish_state(false);'
                  - homeassistant.service:
                      service: persistent_notification.create
                      data:
                        title: "Spa Controller — CRITICAL TEMPERATURE ALARM"
                        message: "Temperature exceeded 42°C. Heater disabled. Pumps still running. Manual reset required."
          else:
            - if:
                condition:
                  lambda: 'return id(high_temp_alarm);'
                then:
                  - logger.log: "Temperature returned to safe range. High temp alarm cleared."
                  - globals.set:
                      id: high_temp_alarm
                      value: 'false'


  ###########################################################################
  ## FILTER CYCLE — automatic periodic water filtration
  ###########################################################################
  - id: filter_cycle_loop
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(filter_cycle_enabled);'
              - lambda: 'return !id(filter_running);'
          then:
            - if:
                condition:
                  lambda: 'return (millis() - id(filter_last_run_time)) > (id(filter_interval_minutes) * 60000U);'
                then:
                  - logger.log: "Starting automatic filter cycle"
                  - globals.set:
                      id: filter_running
                      value: 'true'
                  - globals.set:
                      id: filter_last_run_time
                      value: !lambda 'return millis();'
                  - switch.turn_on: r_P2_high
                  - delay: !lambda 'return id(filter_runtime_minutes) * 60000U;'
                  - switch.turn_off: r_P2_high
                  - globals.set:
                      id: filter_running
                      value: 'false'
                  - logger.log: "Automatic filter cycle complete"


  ###########################################################################
  ## MANUAL FILTER CYCLE — triggered by the "Run Filter Cycle" button
  ###########################################################################
  - id: manual_filter_cycle
    then:
      - if:
          condition:
            lambda: 'return !id(filter_running);'
          then:
            - logger.log: "Manual filter cycle triggered"
            - globals.set:
                id: filter_running
                value: 'true'
            - globals.set:
                id: filter_last_run_time
                value: !lambda 'return millis();'
            - switch.turn_on: r_P2_high
            - delay: !lambda 'return id(filter_runtime_minutes) * 60000U;'
            - switch.turn_off: r_P2_high
            - globals.set:
                id: filter_running
                value: 'false'
            - logger.log: "Manual filter cycle complete"
          else:
            - logger.log: "Filter cycle already running — ignoring manual trigger."


## ═══════════════════════════════════════════════════════════════════════════
## INTERVALS — periodic background tasks
## ═══════════════════════════════════════════════════════════════════════════

interval:

  ## Normal sensor polling — only active AFTER boot test completes
  - interval: 5s
    then:
      - if:
          condition:
            lambda: 'return !id(boot_testing_active);'
          then:
            - component.update: outlet_sensor
            - component.update: inlet_sensor
            - component.update: spa_sensor

  ## Filter cycle scheduler
  - interval: 60s
    then:
      - script.execute: filter_cycle_loop


## ═══════════════════════════════════════════════════════════════════════════
## CLIMATE — thermostat for spa water temperature
## ═══════════════════════════════════════════════════════════════════════════

climate:
  - platform: thermostat
    id: spa_thermostat
    name: "Spa Temp Controller"
    sensor: spa_temp
    min_heating_off_time: 60s
    min_heating_run_time: 3s
    min_idle_time: 240s
    heat_action:
      - if:
          condition:
            ## Triple safety gate — all must be true to heat
            lambda: 'return id(startup_test_complete) && !id(high_temp_alarm) && !id(boot_failed);'
          then:
            - switch.turn_on: virtual_heater
    idle_action:
      - switch.turn_off: virtual_heater
    visual:
      max_temperature: 40.6
      min_temperature: 5
