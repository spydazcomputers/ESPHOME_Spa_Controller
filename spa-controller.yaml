### SPA CONTROLLER — ESPHome HMI Replacement
### Home Assistant dashboard replaces dead OEM interface
###############################################################################
### PROJECT OVERVIEW
### ────────────────────────────────────────────────────────────────────────────
### Hardware: ESP32 (uPesy WROOM DevKit) connected to the Apollo 11
###           spa pack relay box via DB15 terminal adapter
### Framework: ESPHome with ESP-IDF
### Integration: Home Assistant (native API, encrypted)
### Purpose:  The Apollo 11 spa pack's original HMI/controller board is
###           dead. The relay box and all power-stage hardware are still
###           fully functional. This project replaces the OEM interface
###           with an ESP32 that plugs into the relay box's DB15 port
###           via a terminal adapter, using a Home Assistant dashboard
###           as the new user interface.
###
### The Apollo 11 relay box contains the actual relays that switch the
### heater, pumps, and circulator. The ESP32 does NOT drive relays
### directly — it sends logic-level signals through the DB15 connector
### to the relay box, which handles all power switching. The relay box
### also provides 3.3 V power to the ESP32 through the DB15 connection.
###
### IMPORTANT NOTE (May 2026):
###   Pump 2 LOW speed is NOT supported by the current motor/pump.
###   DB15 Pin 14 / GPIO12 is RESERVED for future P2 Low support.
###   All filter cycle and manual P2 logic uses P2 HIGH only.
###
### ════════════════════════════════════════════════════════════════════════════
### HARDWARE ARCHITECTURE
### ════════════════════════════════════════════════════════════════════════════
###
### PHYSICAL CONNECTION
### ───────────────────
### ESP32 (uPesy WROOM) → DB15 terminal adapter → DB15 port on Apollo 11
### relay box. The relay box provides 3.3 V power to the ESP32 via Pin 1
### (primary) and Pin 7 (aux), with an isolated 0 V return on Pin 9.
### All relay control signals and sensor inputs pass through this single
### DB15 connector (spa temp sensor excepted — separate wiring loom).
###
### RELAY BOX INTERFACE
### ───────────────────
### The Apollo 11 relay box energises its internal relays when the
### corresponding DB15 input pin is driven HIGH (3.3 V). All GPIO
### outputs use inverted: false so that:
###
###   ESPHome turn_on  → GPIO HIGH (3.3 V) → relay box relay ENERGISED
###   ESPHome turn_off → GPIO LOW  (0 V)   → relay box relay DE-ENERGISED
###
### Push-pull outputs actively drive both states — no external pull-ups
### needed. (Legacy pull-up on GPIO32 from old open-drain config can be
### removed.)
###
### DB15 PINOUT CROSS-REFERENCE
### ───────────────────────────
###   DB15 Pin │ Wire │ GPIO   │ ESPHome ID      │ Type     │ Function
###   ─────────┼──────┼────────┼─────────────────┼──────────┼────────────────────────
###   Pin 1    │  1   │ 3.3V   │ —               │ Power    │ 3.3 V from relay box
###   Pin 2    │  3   │ GPIO32 │ r_HiLim_1       │ Output   │ Heater hi-limit relay 1
###   Pin 3    │  5   │ GPIO33 │ r_HiLim_2       │ Output   │ Heater hi-limit relay 2
###   Pin 4    │  7   │ GPIO25 │ r_Heater        │ Output   │ Heater coil relay
###   Pin 5    │  9   │ GPIO36 │ inlet_sensor    │ ADC In   │ Inlet water temp (NTC)
###   Pin 6    │ 11   │ GPIO39 │ outlet_sensor   │ ADC In   │ Outlet water temp (NTC)
###   Pin 7    │ 13   │ 3.3V   │ —               │ Power    │ 3.3 V MCU supply (aux)
###   Pin 8    │ 15   │ —      │ —               │ —        │ Unknown (unconnected)
###   Pin 9    │  2   │ 0V     │ —               │ Power    │ Isolated 0 V (not grounded)
###   Pin 10   │  4   │ GPIO26 │ r_P1_low        │ Switch   │ Pump 1 — low speed
###   Pin 11   │  6   │ GPIO27 │ r_P1_high       │ Switch   │ Pump 1 — high speed
###   Pin 12   │  8   │ —      │ —               │ Output   │ Light relay (unconnected)
###   Pin 13   │ 10   │ GPIO14 │ r_Circ          │ Switch   │ Circulator pump
###   Pin 14   │ 12   │ GPIO21 │ [reserved]      │ —        │ Pump 2 Low (future)
###   Pin 15   │ 14   │ GPIO13 │ r_P2_high       │ Switch   │ Pump 2 — high speed
###
### ═══════════════════════════════════════════════════════════════════════════
### FACEPLATE — OLED DISPLAY + PUSH-BUTTONS
### ═══════════════════════════════════════════════════════════════════════════
###
### The faceplate is a local HMI panel mounted at the spa. It provides
### basic control and monitoring WITHOUT requiring a phone, tablet, or
### Home Assistant connection. All faceplate GPIOs are on the RIGHT side
### of the ESP32 DevKit C, physically separated from the DB15 signals.
###
### ┌─────────────────────────────────────────────────────────────────────┐
### │ HARDWARE                                                            │
### ├─────────────────────────────────────────────────────────────────────┤
### │                                                                     │
### │ DISPLAY: SSD1306 128×64 OLED, I²C bus, 0x3C                         │
### │          Connected via GPIO22 (SDA) and GPIO23 (SCL)                │
### │          Refresh rate: 2 seconds (LVGL label updates)               │
### │          Driven by LVGL widget engine inside ESPHome                │
### │                                                                     │
### │ BUTTONS: 4× momentary push-buttons, active LOW                      │
### │          Internal pull-ups enabled, 50 ms debounce                  │
### │          Active-low means: button pressed = GPIO reads LOW          │
### │          All buttons are marked internal (not exposed to HA)        │
### │                                                                     │
### └─────────────────────────────────────────────────────────────────────┘
###
### FACEPLATE GPIO MAP
### ──────────────────
###   GPIO  │ ESPHome ID      │ Type     │ Function
###   ──────┼─────────────────┼──────────┼────────────────────────────────
###   GPIO22│ (I²C SDA)       │ I²C      │ SSD1306 OLED display data
###   GPIO23│ (I²C SCL)       │ I²C      │ SSD1306 OLED display clock
###   GPIO19│ btn_p1          │ Input PU │ Pump 1 cycle button
###   GPIO18│ btn_p2          │ Input PU │ Pump 2 cycle button
###   GPIO16│ btn_temp_up     │ Input PU │ Temperature setpoint UP
###   GPIO17│ btn_temp_down   │ Input PU │ Temperature setpoint DOWN
###
### NOTE: GPIO16 is a strapping pin — internal pull-up to HIGH at boot
###       is the correct/safe default (button not pressed = HIGH). ✓
###
### BUTTON BEHAVIOUR
### ────────────────
### Each pump button cycles through available states:
###
### P1 BUTTON (GPIO19) — three states:
###   ┌─────┐  press  ┌─────┐  press  ┌──────┐  press  ┌─────┐
###   │ OFF │ ──────→ │ LOW │ ──────→ │ HIGH │ ──────→ │ OFF │
###   └─────┘         └─────┘         └──────┘         └─────┘
###
###   Off  → press → Pump 1 Low ON (auto-off timer starts)
###   Low  → press → Pump 1 High ON (interlock kills Low, timer restarts)
###   High → press → Pump 1 OFF (restores Low if virtual heater active)
###
### P2 BUTTON (GPIO18) — two states (P2 Low not supported):
###   ┌─────┐  press  ┌──────┐  press  ┌─────┐
###   │ OFF │ ──────→ │ HIGH │ ──────→ │ OFF │
###   └─────┘         └──────┘         └─────┘
###
###   Off  → press → Pump 2 High ON (auto-off timer starts)
###   High → press → Pump 2 OFF (blocked if filter cycle active)
###
### TEMP UP (GPIO5):
###   Each press increases the thermostat setpoint by +1°F (+0.5556°C)
###   Clamped at 40.6°C (105°F) maximum
###
### TEMP DOWN (GPIO17):
###   Each press decreases the thermostat setpoint by −1°F (−0.5556°C)
###   Clamped at 5.0°C (41°F) minimum
###
### CONFIG MODE (hidden combo):
###   Hold P1 + Temp Down simultaneously for 10 seconds
###   Triggers enter_config_mode script (placeholder for future use)
###
### OLED DISPLAY LAYOUT
### ────────────────────
### The display is divided into four rows using LVGL labels:
###
###   ┌──────────────────────────────────┐
###   │                       -72 dBm    │ ← lbl_wifi (font_label 10px)
###   │  38.5°C                          │ ← lbl_temp_current (font_temp 20px)
###   │  Set: 39.0°C                     │ ← lbl_temp_setpoint (font_info 12px)
###   │  P1:Lo    P2:Off                 │ ← lbl_p1 + lbl_p2 (font_label 10px)
###   └──────────────────────────────────┘
###
### Label updates run on a 2-second interval:
###   lbl_wifi          — WiFi RSSI in dBm (top-right)
###   lbl_temp_current  — Current spa_temp reading in °C
###   lbl_temp_setpoint — Thermostat target in °C ("Set: xx.x°C")
###   lbl_p1            — Pump 1 state: "P1:Off", "P1:Lo", or "P1:Hi"
###   lbl_p2            — Pump 2 state: "P2:Off" or "P2:Hi"
###
### When spa_temp is NaN (sensor not ready), display shows "--.-°C"
### When thermostat target is NaN, display shows "Set: --.-°C"
###
### TEMPERATURE SENSORS
### ───────────────────
### Three 10 kOhm NTC thermistors in voltage-divider configurations.
### The inlet and outlet sensors are OEM — built into the Apollo 11
### relay box and physically attached to the heater manifold. Their
### signals are carried through the DB15 connector. The spa body sensor
### is external, added as part of this project to measure the actual
### spa water temperature for thermostat control.
###
###   Sensor   │ GPIO │ Config     │ Ref Resistor │ Location          │ Origin
###   ─────────┼──────┼────────────┼──────────────┼───────────────────┼────────
###   Inlet    │ 36   │ DOWNSTREAM │ 9.0 kOhm    │ Heater manifold   │ OEM
###   Outlet   │ 39   │ DOWNSTREAM │ 9.0 kOhm    │ Heater manifold   │ OEM
###   Spa      │ 34   │ UPSTREAM   │ 10.0 kOhm │ Spa body water  │ Added (separate loom)
###
### ADC pins (GPIO34, 36, 39) are input-only on the ESP32 and have no
### internal pull-up capability. GPIO34 (spa sensor) is NOT on the DB15
### connector — it is wired on a separate loom.
###
### Calibration points (all three sensors):
###   10.0 kOhm   → 25°C    32.665 kOhm → 0°C    6.530 kOhm → 35°C
###
### Filter chain: median (window 5) → EMA (alpha 0.15)
###
### The spa sensor has a user-adjustable calibration offset (spa_temp_offset
### global, HA number entity) applied via a template sensor. This corrected
### "Spa Temperature" is used by the thermostat and alarms. The raw reading
### is also exposed to HA as "Spa Temperature Raw" for comparison.
###
### ════════════════════════════════════════════════════════════════════════════
### HEATER SAFETY ARCHITECTURE
### ════════════════════════════════════════════════════════════════════════════
###
### The heater circuit inside the Apollo 11 relay box is a THREE-RELAY
### SERIES CHAIN:
###
###   [Hi-Limit 1] ──── [Hi-Limit 2] ──── [Heater Coil Relay]
###     DB15/2             DB15/3             DB15/4
###     GPIO32             GPIO33             GPIO25
###
### ALL THREE relays must be energised for current to flow through the
### heating element. Opening ANY ONE relay breaks the circuit. This
### provides two independent safety cutouts:
###
### Layer 1 — Software (runtime):
###   The thermostat climate entity only calls virtual_heater turn_on
###   when three conditions are met:
###     1. startup_test_complete == true
###     2. high_temp_alarm == false
###     3. boot_failed == false
###
### Layer 2 — Software (high-temp alarm):
###   If any sensor (inlet, outlet, or spa) exceeds 42°C, the alarm
###   fires: heater relay OFF, both hi-limits OFF, virtual heater state
###   updated. Pumps STAY RUNNING for circulation/cooling. Manual reset
###   required via HA button.
###
### Layer 3 — Hardware (verified on every boot):
###   The startup self-test individually verifies that each hi-limit
###   relay can independently break the heater circuit. See STARTUP
###   TEST below.
###
### VIRTUAL HEATER
### ──────────────
### The "Virtual Heater" template switch is the ONLY approved way to
### turn the heater on. It enforces the correct energisation sequence:
###   ON:  HL1 → HL2 → 500ms → Pump 1 Low → 500ms → Heater relay
###   OFF: Heater relay → 500ms → Pump 1 Low off → HL2 off → HL1 off
###
### ════════════════════════════════════════════════════════════════════════════
### STARTUP SELF-TEST (runs on every boot)
### ════════════════════════════════════════════════════════════════════════════
###
### The startup test verifies the heater relay, both hi-limit safety
### cutouts, and water flow on every boot before the system is allowed
### to heat. The test exploits the fact that stagnant water in the heater
### manifold heats up rapidly with even a short heater pulse, producing
### large, easily-detected temperature rises on the OEM outlet NTC
### (which is physically attached to the heater element inside the
### relay box).
###
### The ADC/NTC sensor chain lacks the resolution to detect inlet-to-
### outlet temperature deltas with water flowing — the signal is too
### small relative to sensor noise. All heater tests therefore use
### stagnant water (all pumps OFF) or pump flushes to reset the manifold
### to a known cool state.
###
### TEST SEQUENCE
### ─────────────
###
### SENSOR VALIDATION (~12s)
###   Prime the median/EMA filter chains with 5 rounds of manual reads.
###   Verify inlet and outlet are in the -10°C to 100°C sane range.
###
### STEP 1 — Hi-Limit 1 ON only (5s)
###   Circuit is incomplete (HL2 and Heater relay both OFF).
###   Verify NO temperature change. Proves HL1 alone cannot fire heater.
###
### STEP 2 — Both Hi-Limits ON, Heater OFF (5s)
###   Circuit is still incomplete (Heater relay OFF).
###   Verify NO temperature change. Proves hi-limits alone cannot fire.
###
### STEP 3 — Full circuit, Heater ON (pulse)
###   All three relays energised. Heater fires into stagnant water for
###   heater_pulse_ms (default 2000 ms, tunable from HA, clamped 6s max).
###   Verify temperature RISE >= 0.5°C on outlet sensor.
###   "Check once, retry once" — if first read window doesn't show enough
###   rise, a second window of the same duration is used.
###   50°C safety abort at each window boundary.
###   HEATER RELAY STAYS ON after this step.
###
### STEP 4 — Hi-Limit 1 break test (~35s)
###   Heater relay still ON. Hi-Limit 1 OPENED.
###   Pump 1 High runs for 15s — flushes cool spa water through the
###   manifold, clearing all residual heat from Step 3.
###   Pump stops. Water is stagnant and cool. Heater relay still ON.
###   Wait 10s. If HL1 is NOT breaking the circuit, the stagnant water
###   heats up immediately — unmistakable failure.
###   Verify NO rise > 0.5°C (temp_deadband).
###   The pump flush also implicitly verifies water flow.
###
### STEP 5 — Hi-Limit 2 break test (~35s)
###   Same as Step 4 but for Hi-Limit 2. Heater relay still ON.
###   Safe relay transition: HL2 opens FIRST (while HL1 is still open),
###   THEN HL1 closes — the circuit is NEVER complete during the swap.
###   Pump flush 15s, stagnant 10s check, verify NO rise.
###
### COMPLETION
###   All outputs OFF. startup_test_complete = true. Circulator pump
###   starts. HA notification sent.
###
### ABORT
###   Any failure → all outputs killed, boot_failed = true, HA
###   notification. "Retry Startup Test" button available in HA.
###
### TIMING
### ──────
###   Sensor prime:          ~12s
###   Steps 1-2:             ~16s
###   Step 3 (fast/retry):   ~12-20s
###   Step 4:                ~35s
###   Step 5:                ~35s
###   Shutdown:              ~2s
###   TOTAL:                 ~112-120s (~2 minutes)
###
### ════════════════════════════════════════════════════════════════════════════
### RUNTIME OPERATION
### ════════════════════════════════════════════════════════════════════════════
###
### THERMOSTAT
### ──────────
### ESPHome thermostat climate entity ("Spa Temp Controller") using the
### calibrated spa_temp sensor (external, added by this project). Calls
### virtual_heater on/off.
### Triple safety gate: startup_test_complete && !high_temp_alarm && !boot_failed
### Timing: min_heating_off 60s, min_heating_run 3s, min_idle 240s.
### Range: 5°C – 40.6°C.
###
### HIGH-TEMP ALARM (42°C)
### ──────────────────────
### Triggers if ANY sensor exceeds 42°C. Kills heater circuit (all 3
### relays OFF). Pumps STAY RUNNING for circulation cooling. Virtual
### heater state updated via publish_state() to avoid triggering
### turn_off_action (which would kill the pump). Manual reset required
### via "Reset Hi-Limit" button in HA.
###
### FILTER CYCLE
### ────────────
### Automatic periodic filtration using Pump 2 High.
### Interval and runtime configurable from HA (default: every 4 hours,
### 60 minutes per cycle). Manual trigger button available. Timer text
### sensors show remaining cycle time and next scheduled run in hh:mm.
### NOTE: P2 Low is not supported — filter cycle uses P2 High only.
###
### SENSOR POLLING
### ──────────────
### During boot test: sensors polled manually by test script only
### (boot_testing_active suppresses the interval timer).
### After boot: 5-second interval polls inlet, outlet, and spa sensors.
###
### ════════════════════════════════════════════════════════════════════════════
### HOME ASSISTANT ENTITIES
### ════════════════════════════════════════════════════════════════════════════
###
### SWITCHES
###   Circ Pump          — Circulator
###   Virtual Heater     — Safe heater on/off abstraction
###
### SENSORS
###   Inlet Temperature       — OEM heater manifold inlet (°C)
###   Outlet Temperature      — OEM heater manifold outlet (°C)
###   Spa Temperature Raw     — Uncorrected external spa body NTC reading (°C)
###   Spa Temperature         — Corrected spa reading (raw + offset) (°C)
###   Inlet/Outlet Voltage & Resistance — raw ADC chain (debug)
###
### BINARY SENSORS
###   Startup Test Complete    — true after all tests pass
###   High Temperature Alarm   — true when any sensor > 42°C
###   Hi-Limit Relay Triggered — true when alarm has fired (latched)
###   Boot Failed              — true if startup test failed
###   Pump 1 Low Running       — true when P1 Low switch is on
###   Pump 1 High Running      — true when P1 High switch is on
###   Pump 2 High Running      — true when P2 High switch is on
###
### BUTTONS
###   Pump 1 Low           — Toggle P1 Low (auto-off timer)
###   Pump 1 High (Jets)   — Toggle P1 High (auto-off timer)
###   Pump 2 High          — Toggle P2 High (auto-off timer)
###   Reset Hi-Limit       — Clears alarm, allows heating to resume
###   Retry Startup Test   — Re-runs full test sequence
###   Run Filter Cycle     — Manual filter trigger
###
### NUMBER INPUTS (all numeric entry boxes, not sliders)
###   Heater Test Pulse (ms)            — Startup test pulse duration (500-6000)
###   Spa Temp Offset (°C)              — Calibration offset (-5.0 to +5.0)
###   Pump Auto-Off Timer (minutes)     — Auto-off countdown (5-120)
###   Filter Cycle Interval (minutes)   — Time between filter runs (60-1440)
###   Filter Cycle Runtime (minutes)    — Duration of each filter run (1-120)
###
### TEXT SENSORS
###   Filter Cycle Remaining  — hh:mm countdown during active cycle
###   Next Filter Cycle       — hh:mm until next scheduled cycle
###
### CLIMATE
###   Spa Temp Controller     — Thermostat entity (heat mode only)
###
### ════════════════════════════════════════════════════════════════════════════
### GLOBALS REFERENCE
### ════════════════════════════════════════════════════════════════════════════
###
###   ID                      │ Type    │ Persist │ Purpose
###   ────────────────────────┼─────────┼─────────┼──────────────────────────
###   startup_test_complete   │ bool    │ no      │ Gate for thermostat
###   high_temp_alarm         │ bool    │ no      │ Over-temp flag
###   hi_limit_triggered      │ bool    │ no      │ Latched alarm flag
###   boot_testing_active     │ bool    │ no      │ Suppresses sensor polling
###   boot_failed             │ bool    │ no      │ Blocks heating
###   heater_temp_baseline_in │ float   │ no      │ Test reference temp
###   heater_temp_baseline_out│ float   │ no      │ Test reference temp
###   heater_pulse_ms         │ uint32  │ yes     │ Test pulse duration
###   spa_temp_offset         │ float   │ yes     │ Spa NTC cal offset
###   temp_deadband           │ float   │ no      │ Rise/fall threshold
###   pump_auto_off_minutes   │ uint32  │ yes     │ Manual pump timeout
###   filter_last_run_time    │ uint32  │ yes     │ millis() of last run
###   filter_cycle_enabled    │ bool    │ yes     │ Auto-filter on/off
###   filter_interval_minutes │ uint32  │ yes     │ Time between cycles
###   filter_runtime_minutes  │ uint32  │ yes     │ Duration per cycle
###   filter_running          │ bool    │ no      │ Cycle in progress
###   config_mode             │ bool    │ no      │ Faceplate config flag
###   config_hold_start       │ uint32  │ no      │ Button hold timer
###
