## ╚═╝  ╚═╝╚═╝      ╚═════╝ ╚══════╝╚══════╝ ╚═════╝     ╚═╝ ╚═╝
##
##  SPA CONTROLLER — ESPHome HMI Replacement
##  Home Assistant dashboard replaces dead OEM interface
##
###############################################################################
##
## PROJECT OVERVIEW
## ─────────────────────────────────────────────────────────────────────
##   Hardware:    ESP32 (uPesy WROOM DevKit) connected to the Apollo 11
##                spa pack relay box via DB15 terminal adapter
##   Framework:   ESPHome with ESP-IDF
##   Integration: Home Assistant (native API, encrypted)
##   Purpose:     The Apollo 11 spa pack's original HMI/controller board is
##                dead. The relay box and all power-stage hardware are still
##                fully functional. This project replaces the OEM interface
##                with an ESP32 that plugs into the relay box's DB15 port
##                via a terminal adapter, using a Home Assistant dashboard
##                as the new user interface.
##
##   The Apollo 11 relay box contains the actual relays that switch the
##   heater, pumps, and circulator. The ESP32 does NOT drive relays
##   directly — it sends logic-level signals through the DB15 connector
##   to the relay box, which handles all power switching. The relay box
##   also provides 3.3 V power to the ESP32 through the DB15 connection.
##
##
## ═════════════════════════════════════════════════════════════════════
## HARDWARE ARCHITECTURE
## ═════════════════════════════════════════════════════════════════════
##
## PHYSICAL CONNECTION
## ───────────────────
##   ESP32 (uPesy WROOM) → DB15 terminal adapter → DB15 port on Apollo 11
##   relay box. The relay box provides 3.3 V power to the ESP32 via Pin 1.
##   All relay control signals and sensor inputs pass through this single
##   DB15 connector.
##
## RELAY BOX INTERFACE
## ───────────────────
##   The Apollo 11 relay box energises its internal relays when the
##   corresponding DB15 input pin is driven HIGH (3.3 V). All GPIO
##   outputs use inverted: false so that:
##     ESPHome turn_on  → GPIO HIGH (3.3 V) → relay box relay ENERGISED
##     ESPHome turn_off → GPIO LOW  (0 V)   → relay box relay DE-ENERGISED
##   Push-pull outputs actively drive both states — no external pull-ups
##   needed. (Legacy pull-up on GPIO32 from old open-drain config can be
##   removed.)
##
## DB15 PINOUT CROSS-REFERENCE
## ───────────────────────────
##   DB15 Pin │ GPIO   │ ESPHome ID      │ Type     │ Function
##   ─────────┼────────┼─────────────────┼──────────┼─────────────────────
##   Pin 1    │ 3.3V   │ —               │ Power    │ 3.3 V from relay box
##   Pin 2    │ GPIO32 │ r_HiLim_1       │ Output   │ Heater hi-limit relay 1
##   Pin 3    │ GPIO33 │ r_HiLim_2       │ Output   │ Heater hi-limit relay 2
##   Pin 4    │ GPIO25 │ r_Heater        │ Output   │ Heater coil relay
##   Pin 5    │ GPIO36 │ inlet_sensor    │ ADC In   │ Inlet water temp (NTC)
##   Pin 6    │ GPIO39 │ outlet_sensor   │ ADC In   │ Outlet water temp (NTC)
##   Pin 7    │ GPIO34 │ spa_sensor      │ ADC In   │ Spa/jacuzzi temp (NTC)
##   Pin 10   │ GPIO26 │ r_P1_low        │ Switch   │ Pump 1 — low speed
##   Pin 11   │ GPIO27 │ r_P1_high       │ Switch   │ Pump 1 — high speed
##   Pin 13   │ GPIO14 │ r_Circ          │ Switch   │ Circulator pump
##   Pin 14   │ GPIO12 │ [reserved]      │ —        │ Pump 2 Low (future)
##   Pin 15   │ GPIO13 │ r_P2_high       │ Switch   │ Pump 2 — high speed
##
##   │                                                                    │
##   │  DISPLAY:  SSD1306 128×64 OLED, I²C bus, 0x3C                     │
##   │            Connected via GPIO22 (SDA) and GPIO23 (SCL)             │
##   │            Refresh rate: 2 seconds (LVGL label updates)            │
##   │            Driven by LVGL widget engine inside ESPHome             │
##   │                                                                    │
##   │  BUTTONS:  4× momentary push-buttons, active LOW                   │
##   │            Internal pull-ups enabled, 50 ms debounce               │
##   │            Active-low means: button pressed = GPIO reads LOW       │
##   │            All buttons are marked internal (not exposed to HA)     │
##   │                                                                    │
##   └────────────────────────────────────────────────────────────────────
##
##   FACEPLATE GPIO MAP
##   ──────────────────
##   GPIO   │ ESPHome ID      │ Type     │ Function
##   ───────┼─────────────────┼──────────┼────────────────────────────────
##   GPIO22 │ (I²C SDA)       │ I²C      │ SSD1306 OLED display data
##   GPIO23 │ (I²C SCL)       │ I²C      │ SSD1306 OLED display clock
##   GPIO19 │ btn_p1          │ Input PU │ Pump 1 cycle button
##   GPIO18 │ btn_p2          │ Input PU │ Pump 2 cycle button
##   GPIO5  │ btn_temp_up     │ Input PU │ Temperature setpoint UP
##   GPIO17 │ btn_temp_down   │ Input PU │ Temperature setpoint DOWN
##
##   NOTE: GPIO5 is a strapping pin — internal pull-up to HIGH at boot
##   is the correct/safe default (button not pressed = HIGH). ✓
##
##
##   BUTTON BEHAVIOUR
##   ────────────────
##   Pump buttons cycle through states based on available speeds:
##
##   P1 BUTTON (GPIO19):  3-state cycle (Low ↔ High)
##     Off  → press → Pump 1 Low ON  (auto-off timer starts)
##     Low  → press → Pump 1 High ON (interlock kills Low, timer restarts)
##     High → press → Pump 1 OFF     (restores Low if virtual heater active)
##
##   P2 BUTTON (GPIO18):  Currently 2-state (High only)
##     Off  → press → Pump 2 High ON  (auto-off timer starts)
##     High → press → Pump 2 OFF      (restores state if filter cycle active)
##
##     NOTE: Future expansion to 3-state (Low ↔ High) when P2_Low relay
##           is physically integrated. Code structure already supports
##           this — see PUMP2_LOW_ENABLED flag below.
##
##   TEMP UP (GPIO5):
##     Each press increases the thermostat setpoint by +1°F (+0.5556°C)
##     Clamped at 40.6°C (105°F) maximum
##
##   TEMP DOWN (GPIO17):
##     Each press decreases the thermostat setpoint by −1°F (−0.5556°C)
##     Clamped at 5.0°C (41°F) minimum
##
##   CONFIG MODE (hidden combo):
##     Hold P1 + Temp Down simultaneously for 10 seconds
##     Triggers enter_config_mode script (placeholder for future use)
##
##
##   OLED DISPLAY LAYOUT
##   ────────────────────
##   The display is divided into four rows using LVGL labels:
##
##   ┌──────────────────────────────────┐
##   │                        -72 dBm   │  ← lbl_wifi     (font_label 10px)
##   │  38.5°C                          │  ← lbl_temp_current (font_temp 20px)
##   │  Set: 39.0°C                     │  ← lbl_temp_setpoint (font_info 12px)
##   │  P1:Lo  P2:Hi                    │  ← lbl_p1 + lbl_p2  (font_label 10px)
##   └──────────────────────────────────┘
##
##   Label updates run on a 2-second interval:
##     lbl_wifi          — WiFi RSSI in dBm (top-right)
##     lbl_temp_current  — Current spa_temp reading in °C
##     lbl_temp_setpoint — Thermostat target in °C ("Set: xx.x°C")
##     lbl_p1            — Pump 1 state: "P1:Off", "P1:Lo", or "P1:Hi"
##     lbl_p2            — Pump 2 state: "P2:Off" or "P2:Hi" (P2:Lo when enabled)
##
##   When spa_temp is NaN (sensor not ready), display shows "--.-°C"
##   When thermostat target is NaN, display shows "Set: --.-°C"

## TEMPERATURE SENSORS
## ───────────────────
##   Three 10 kOhm NTC thermistors in voltage-divider configurations.
##   The inlet and outlet sensors are OEM — built into the Apollo 11
##   relay box and physically attached to the heater manifold. Their
##   signals are carried through the DB15 connector. The spa body sensor
##   is external, added as part of this project to measure the actual
##   spa water temperature for thermostat control.
##
##   Sensor   │ GPIO │ Config     │ Ref Resistor │ Location          │ Origin
##   ─────────┼──────┼────────────┼──────────────┼───────────────────┼────────
##   Inlet    │ 36   │ DOWNSTREAM │ 9.0 kOhm    │ Heater manifold   │ OEM
##   Outlet   │ 39   │ DOWNSTREAM │ 9.0 kOhm    │ Heater manifold   │ OEM
##   Spa      │ 34   │ UPSTREAM   │ 10.0 kOhm   │ Spa body water    │ Added
##
##   ADC pins (GPIO34, 35, 36, 39) are input-only on the ESP32 and have no
##   internal pull-up capability.
##
##   Calibration points (all three sensors):
##     10.0 kOhm → 25°C  |  32.665 kOhm → 0°C  |  6.530 kOhm → 35°C
##
##   Filter chain: median (window 5) → EMA (alpha 0.15)
##
##   The spa sensor has a user-adjustable calibration offset (spa_temp_offset
##   global, HA number entity) applied via a template sensor. This corrected
##   "Spa Temperature" is used by the thermostat and alarms. The raw reading
##   is also exposed to HA as "Spa Temperature Raw" for comparison.
##
##
## ═════════════════════════════════════════════════════════════════════
## HEATER SAFETY ARCHITECTURE
## ═════════════════════════════════════════════════════════════════════
##
##   The heater circuit inside the Apollo 11 relay box is a THREE-RELAY
##   SERIES CHAIN:
##
##     [Hi-Limit 1] ──── [Hi-Limit 2] ──── [Heater Coil Relay]
##        DB15/2            DB15/3              DB15/4
##        GPIO25            GPIO26              GPIO13
##
##   ALL THREE relays must be energised for current to flow through the
##   heating element. Opening ANY ONE relay breaks the circuit. This
##   provides two independent safety cutouts:
##
##   Layer 1 — Software (runtime):
##     The thermostat climate entity only calls virtual_heater turn_on
##     when three conditions are met:
##       1. startup_test_complete == true
##       2. high_temp_alarm == false
##       3. boot_failed == false
##
##   Layer 2 — Software (high-temp alarm):
##     If any sensor (inlet, outlet, or spa) exceeds 42°C, the alarm
##     fires: heater relay OFF, both hi-limits OFF, virtual heater state
##     updated. Pumps STAY RUNNING for circulation/cooling. Manual reset
##     required via HA button.
##
##   Layer 3 — Hardware (verified on every boot):
##     The startup self-test individually verifies that each hi-limit
##     relay can independently break the heater circuit. See STARTUP
##     TEST below.
##
## VIRTUAL HEATER
## ──────────────
##   The "Virtual Heater" template switch is the ONLY approved way to
##   turn the heater on. It enforces the correct energisation sequence:
##     ON:  HL1 → HL2 → 500ms → Pump 1 Low → 500ms → Heater relay
##     OFF: Heater relay → 500ms → Pump 1 Low off → HL2 off → HL1 off
##
##
## ═════════════════════════════════════════════════════════════════════
## STARTUP SELF-TEST (runs on every boot)
## ════════��════════════════════════════════════════════════════════════
##
##   The startup test verifies the heater relay, both hi-limit safety
##   cutouts, and water flow on every boot before the system is allowed
##   to heat. The test exploits the fact that stagnant water in the heater
##   manifold heats up rapidly with even a short heater pulse, producing
##   large, easily-detected temperature rises on the OEM outlet NTC
##   (which is physically attached to the heater element inside the
##   relay box).
##
##   The ADC/NTC sensor chain lacks the resolution to detect inlet-to-
##   outlet temperature deltas with water flowing — the signal is too
##   small relative to sensor noise. All heater tests therefore use
##   stagnant water (all pumps OFF) or pump flushes to reset the manifold
##   to a known cool state.
##
## TEST SEQUENCE
## ─────────────
##
##   SENSOR VALIDATION (~12s)
##     Prime the median/EMA filter chains with 5 rounds of manual reads.
##     Verify inlet and outlet are in the -10°C to 100°C sane range.
##
##   STEP 1 — Hi-Limit 1 ON only (5s)
##     Circuit is incomplete (HL2 and Heater relay both OFF).
##     Verify NO temperature change. Proves HL1 alone cannot fire heater.
##
##   STEP 2 — Both Hi-Limits ON, Heater OFF (5s)
##     Circuit is still incomplete (Heater relay OFF).
##     Verify NO temperature change. Proves hi-limits alone cannot fire.
##
##   STEP 3 — Full circuit, Heater ON (pulse)
##     All three relays energised. Heater fires into stagnant water for
##     heater_pulse_ms (default 2000 ms, tunable from HA, clamped 6s max).
##     Verify temperature RISE >= 0.5°C on outlet sensor.
##     "Check once, retry once" — if first read window doesn't show enough
##     rise, a second window of the same duration is used.
##     50°C safety abort at each window boundary.
##     HEATER RELAY STAYS ON after this step.
##
##   STEP 4 — Hi-Limit 1 break test (~35s)
##     Heater relay still ON. Hi-Limit 1 OPENED.
##     Pump 1 High runs for 15s — flushes cool spa water through the
##     manifold, clearing all residual heat from Step 3.
##     Pump stops. Water is stagnant and cool. Heater relay still ON.
##     Wait 10s. If HL1 is NOT breaking the circuit, the stagnant water
##     heats up immediately — unmistakable failure.
##     Verify NO rise > 0.5°C (temp_deadband).
##     The pump flush also implicitly verifies water flow.
##
##   STEP 5 — Hi-Limit 2 break test (~35s)
##     Same as Step 4 but for Hi-Limit 2. Heater relay still ON.
##     Safe relay transition: HL2 opens FIRST (while HL1 is still open),
##     THEN HL1 closes — the circuit is NEVER complete during the swap.
##     Pump flush 15s, stagnant 10s check, verify NO rise.
##
##   COMPLETION
##     All outputs OFF. startup_test_complete = true. Circulator pump
##     starts. HA notification sent.
##
##   ABORT
##     Any failure → all outputs killed, boot_failed = true, HA
##     notification. "Retry Startup Test" button available in HA.
##
## TIMING
## ──────
##   Sensor prime:        ~12s
##   Steps 1-2:           ~16s
##   Step 3 (fast/retry): ~12-20s
##   Step 4:              ~35s
##   Step 5:              ~35s
##   Shutdown:            ~2s
##   TOTAL:               ~112-120s (~2 minutes)
##
##
## ═════════════════════════════════════════════════════════════════════
## RUNTIME OPERATION
## ═════════════════════════════════════════════════════════════════════
##
## THERMOSTAT
## ──────────
##   ESPHome thermostat climate entity ("Spa Temp Controller") using the
##   calibrated spa_temp sensor (external, added by this project). Calls
##   virtual_heater on/off.
##   Triple safety gate: startup_test_complete && !high_temp_alarm && !boot_failed
##   Timing: min_heating_off 60s, min_heating_run 3s, min_idle 240s.
##   Range: 5°C – 40.6°C.
##
## HIGH-TEMP ALARM (42°C)
## ──────────────────────
##   Triggers if ANY sensor exceeds 42°C. Kills heater circuit (all 3
##   relays OFF). Pumps STAY RUNNING for circulation cooling. Virtual
##   heater state updated via publish_state() to avoid triggering
##   turn_off_action (which would kill the pump). Manual reset required
##   via "Reset Hi-Limit" button in HA.
##
## FILTER CYCLE
## ────────────
##   Automatic periodic filtration using Pump 2 High.
##   Interval and runtime configurable from HA (default: every 4 hours,
##   60 minutes per cycle). Manual trigger button available. Timer text
##   sensors show remaining cycle time and next scheduled run in hh:mm.
##
##   NOTE: Currently uses Pump 2 High exclusively. When Pump 2 Low support
##         is added in the future, filter cycle logic may optionally use
##         P2 Low for extended low-speed filtration cycles.
##
## SENSOR POLLING
## ──────────────
##   During boot test: sensors polled manually by test script only
##   (boot_testing_active suppresses the interval timer).
##   After boot: 5-second interval polls inlet, outlet, and spa sensors.
##
##
## ═════════════════════════════════════════════════════════════════════
## HOME ASSISTANT ENTITIES
## ═════════════════════════════════════════════════════════════════════
##
## SWITCHES
##   Pump 1 Low          — Heater flow pump (interlocked with High)
##   Pump 1 High         — Jets (interlocked with Low)
##   Circ Pump           — Circulator
##   Pump 2 High         — Filter cycle pump (currently active)
##   Virtual Heater      — Safe heater on/off abstraction
##
##   Future:
##   Pump 2 Low          — Extended filtration (when P2_Low relay added)
##
## SENSORS
##   Inlet Temperature   — OEM heater manifold inlet (°C)
##   Outlet Temperature  — OEM heater manifold outlet (°C)
##   Spa Temperature Raw — Uncorrected external spa body NTC reading (°C)
##   Spa Temperature     — Corrected spa reading (raw + offset) (°C)
##   Inlet/Outlet Voltage & Resistance — raw ADC chain (debug)
##
## BINARY SENSORS
##   Startup Test Complete   — true after all tests pass
##   High Temperature Alarm  — true when any sensor > 42°C
##   Hi-Limit Relay Triggered — true when alarm has fired (latched)
##   Boot Failed             — true if startup test failed
##
## BUTTONS
##   Reset Hi-Limit       — Clears alarm, allows heating to resume
##   Retry Startup Test   — Re-runs full test sequence
##   Run Filter Cycle     — Manual filter trigger
##
## NUMBER INPUTS (all numeric entry boxes, not sliders)
##   Heater Test Pulse (ms)          — Startup test pulse duration (500-6000)
##   Spa Temp Offset (°C)            — Calibration offset (-5.0 to +5.0)
##   Filter Cycle Interval (minutes) — Time between filter runs (60-1440)
##   Filter Cycle Runtime (minutes)  — Duration of each filter run (1-120)
##
## TEXT SENSORS
##   Filter Cycle Remaining — hh:mm countdown during active cycle
##   Next Filter Cycle      — hh:mm until next scheduled cycle
##
## CLIMATE
##   Spa Temp Controller — Thermostat entity (heat mode only)
##
##
## ═════════════════════════════════════════════════════════════════════
## GLOBALS REFERENCE
## ═════════════════════════════════════════════════════════════════════
##
##   ID                       │ Type    │ Persist │ Purpose
##   ─────────────────────────┼─────────┼─────────┼─────────────────────
##   startup_test_complete    │ bool    │ no      │ Gate for thermostat
##   high_temp_alarm          │ bool    │ no      │ Over-temp flag
##   hi_limit_triggered       │ bool    │ no      │ Latched alarm flag
##   boot_testing_active      │ bool    │ no      │ Suppresses sensor polling
##   boot_failed              │ bool    │ no      │ Blocks heating
##   heater_temp_baseline_in  │ float   │ no      │ Test reference temp
##   heater_temp_baseline_out │ float   │ no      │ Test reference temp
##   heater_pulse_ms          │ uint32  │ yes     │ Test pulse duration
##   spa_temp_offset          │ float   │ yes     │ Spa NTC cal offset
##   temp_deadband            │ float   │ no      │ Rise/fall threshold
##   filter_last_run_time     │ uint32  │ yes     │ millis() of last run
##   filter_cycle_enabled     │ bool    │ yes     │ Auto-filter on/off
##   filter_interval_minutes  │ uint32  │ yes     │ Time between cycles
##   filter_runtime_minutes   │ uint32  │ yes     │ Duration per cycle
##   filter_running           │ bool    │ no      │ Cycle in progress
##
###############################################################################

## ═════════════════════════════════════════════════════════════════════
## ESPHOME CORE — device identity and boot behaviour
## ═════════════════════════════════════════════════════════════════════

esphome:
  name: spa-controller
  friendly_name: Spa Controller
  on_boot:
    ## Priority 600 = runs after network is up and sensors are initialised.
    ## NOTE: script.execute is async — do NOT put actions after it that
    ## depend on the test being complete. Circ pump is started inside
    ## the test completion handler, not here.
    priority: 600
    then:
      - script.execute: startup_test_sequence

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "meYMpUo1HqkpkR27l0lvgatyVElKyqNFeNGdFiFmaNI="

ota:
  - platform: esphome
    password: "a3e355c58dd9f84465293ebdcc2b0e32"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Spa-Controller Fallback Hotspot"
    password: "ZhJIBrjT85cJ"

captive_portal:


## ═════════════════════════════════════════════════════════════════════
## I2C — OLED faceplate display bus
## ═════════════════════════════════════════════════════════════════════

i2c:
  sda: GPIO22
  scl: GPIO23
  scan: true
  frequency: 400kHz


## ═════════════════════════════════════════════════════════════════════
## FONTS — LVGL display fonts
## ═════════════════════════════════════════════════════════════════════

font:
  - file: "gfonts://Roboto"
    id: font_temp
    size: 20
    bpp: 4
    glyphs: "0123456789.-°CF "
  - file: "gfonts://Roboto"
    id: font_info
    size: 12
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_label
    size: 10
    bpp: 4


## ═════════════════════════════════════════════════════════════════════
## DISPLAY — SSD1306 128x64 OLED
## ═════════════════════════════════════════════════════════════════════

display:
  - platform: ssd1306_i2c
    id: oled_display
    model: "SSD1306 128x64"
    address: 0x3C
    auto_clear_enabled: false
    update_interval: 1s


## ═════════════════════════════════════════════════════════════════════
## LVGL — faceplate UI
## ═════════════════════════════════════════════════════════════════════

lvgl:
  displays:
    - oled_display
  log_level: WARN
  pages:
    - id: main_page
      widgets:
        - label:
            id: lbl_wifi
            align: TOP_RIGHT
            x: -2
            y: 2
            text_font: font_label
            text: ""
        - label:
            id: lbl_temp_current
            x: 2
            y: 14
            text_font: font_temp
            text: "--.-°C"
        - label:
            id: lbl_temp_setpoint
            x: 2
            y: 38
            text_font: font_info
            text: "Set: --.-°C"
        - label:
            id: lbl_p1
            x: 6
            y: 54
            text_font: font_label
            text: "P1:Off"
        - label:
            id: lbl_p2
            x: 38
            y: 54
            text_font: font_label
            text: "P2:Off"


## ═════════════════════════════════════════════════════════════════════
## GLOBALS — persistent and runtime state variables
## ═════════════════════════════════════════════════════════════════════

globals:

  ## ── Boot / Safety Flags ──────────────────────────────────────────────
  - id: startup_test_complete
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: high_temp_alarm
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: hi_limit_triggered
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: boot_testing_active
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: boot_failed
    type: bool
    restore_value: no
    initial_value: 'false'

  ## ── Heater Test Baselines ────────────────────────────────────────────
  - id: heater_temp_baseline_inlet
    type: float
    restore_value: no

  - id: heater_temp_baseline_outlet
    type: float
    restore_value: no

  ## ── Heater Test Pulse Duration ───────────────────────────────────────
  ## Duration in milliseconds for the initial heater-on period in Step 3.
  ## Tunable from HA without reflashing. Clamped to 6000 ms max in the
  ## test script regardless of what HA sends.
  - id: heater_pulse_ms
    type: uint32_t
    restore_value: yes
    initial_value: '2000'

  ## ── Spa Temperature Calibration ──────────────────────────────────────
  ## Additive offset applied to the raw NTC reading. Positive = reads
  ## warmer, negative = reads cooler. Persists across reboots.
  - id: spa_temp_offset
    type: float
    restore_value: yes
    initial_value: '0.0'

  ## ── Thermostat Tuning ────────────────────────────────────────────────
  - id: temp_deadband
    type: float
    restore_value: no
    initial_value: '0.5'

  ## ── Pump Auto-Off Timer ──────────────────────────────────────────────
  ## Duration in minutes before a manually-activated pump automatically
  ## shuts off. Only applies to pumps started via HA buttons — pumps
  ## started by the thermostat, filter cycle, or startup test are NOT
  ## subject to this timer. Persists across reboots.
  - id: pump_auto_off_minutes
    type: uint32_t
    restore_value: yes
    initial_value: '30'

  ## ── Filter Cycle State (survives reboot) ─────────────────────────────
  - id: filter_last_run_time
    type: uint32_t
    restore_value: yes
    initial_value: '0'

  - id: filter_cycle_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'

  - id: filter_interval_minutes
    type: uint32_t
    restore_value: yes
    initial_value: '240'

  - id: filter_runtime_minutes
    type: uint32_t
    restore_value: yes
    initial_value: '60'

  ## True while a filter cycle (automatic or manual) is actively running.
  ## Used by the filter timer text sensors and to prevent overlapping runs.
  - id: filter_running
    type: bool
    restore_value: no
    initial_value: 'false'

  ## ── Faceplate / Config Mode ──────────────────────────────────────────
  - id: config_mode
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: config_hold_start
    type: uint32_t
    restore_value: no
    initial_value: '0'


## ═════════════════════════════════════════════════════════════════════
## OUTPUTS — heater safety relay GPIOs (not exposed to HA directly)
## ═════════════════════════════════════════════════════════════════════
## These are the three relays in the Apollo 11 relay box that form the
## heater safety chain. They are ESPHome "outputs" (not "switches") so
## they are never directly visible in Home Assistant. The virtual_heater
## template switch is the only approved way to control them.

output:

  ## Pin 2 — Hi-limit relay 1 (safety, series with heater)
  - platform: gpio
    pin: GPIO32
    inverted: false
    id: r_HiLim_1

  ## Pin 3 — Hi-limit relay 2 (safety, series with heater)
  - platform: gpio
    pin: GPIO33
    inverted: false
    id: r_HiLim_2

  ## Pin 4 — Heater coil relay (energises the heating element)
  - platform: gpio
    pin: GPIO25
    id: r_Heater
    inverted: false


## ═════════════════════════════════════════════════════════════════════
## SWITCHES — relay GPIOs (pump switches are internal only)
## ═════════════════════════════════════════════════════════════════════
## Pump switches (P1 Low, P1 High, P2 High) are internal: true — they are
## NOT directly visible in Home Assistant. Users control pumps via HA
## buttons (see BUTTONS section) which act as toggles with an auto-off
## safety countdown. This prevents a pump from being accidentally left
## on forever.
##
## The thermostat (virtual_heater), filter cycle, and startup test scripts
## call these switches directly — they are NOT subject to the auto-off
## timer because those subsystems manage their own shutdown.
##
## The circulator pump is the EXCEPTION — it stays visible in HA as a
## regular toggle switch because it runs continuously after boot and
## should not be subject to an auto-off timer.
##
## PUMP 2 CONFIGURATION:
## Currently only Pump 2 High (GPIO13 / DB15 Pin 15) is active. Pump 2 Low
## (GPIO12 / DB15 Pin 14) is reserved for future expansion. When ready to
## enable P2 Low, uncomment the P2_LOW switch and update P2 button logic
## to support 3-state cycling (Off → Low → High → Off).

switch:

  ## Pin 10 — Pump 1 low speed (used for heater flow)
  ## Internal only — HA controls via "Pump 1 Low" button + auto-off script.
  - platform: gpio
    pin: GPIO26
    id: r_P1_low
    inverted: false
    interlock: [r_P1_low, r_P1_high]
    name: Pump 1 Low
    internal: true

  ## Pin 11 — Pump 1 high speed (jets)
  ## Internal only — HA controls via "Pump 1 High (Jets)" button + auto-off.
  ## Interlocked with P1 Low — turning on High automatically turns off Low.
  - platform: gpio
    pin: GPIO27
    id: r_P1_high
    inverted: false
    interlock: [r_P1_low, r_P1_high]
    name: Pump 1 High
    internal: true

  ## Pin 13 — Circulator pump (low-flow circulation)
  ## NOT internal — visible in HA as a regular toggle switch.
  ## Runs continuously after boot; no auto-off timer.
  - platform: gpio
    pin: GPIO14
    id: r_Circ
    inverted: false
    name: Circ Pump

  ## ── PUMP 2 CONFIGURATION (Currently High-Speed Only) ──────────────────
  ## P2 High is active and used for filter cycles. P2 Low is prepared but
  ## currently disabled. To enable P2 Low in the future:
  ## 1. Uncomment the r_P2_low switch definition below
  ## 2. Update faceplate_p2_cycle script to handle 3-state logic
  ## 3. Update display label logic (lbl_p2) to show "P2:Lo" or "P2:Hi"

  ## [FUTURE] Pin 14 — Pump 2 low speed (for extended filtration)
  ## Uncomment when P2 Low relay is physically added to the spa pack
  ## - platform: gpio
  ##   pin: GPIO12
  ##   id: r_P2_low
  ##   inverted: false
  ##   interlock: [r_P2_low, r_P2_high]
  ##   name: Pump 2 Low
  ##   internal: true

  ## Pin 15 — Pump 2 high speed (currently active, used for filter cycle)
  ## Internal only — HA controls via "Pump 2 High" button + auto-off script.
  ## Interlocked with P2 Low (when P2_Low is enabled in the future).
  - platform: gpio
    pin: GPIO13
    id: r_P2_high
    inverted: false
    interlock: [r_P2_high]  ## Will be [r_P2_low, r_P2_high] when P2_Low enabled
    name: Pump 2 High
    internal: true

  ## Virtual heater — the ONLY safe way to turn the heater on.
  ## Enforces the correct energisation/de-energisation sequence for
  ## the three-relay series chain inside the Apollo 11 relay box.
  - platform: template
    name: "Virtual Heater"
    id: virtual_heater
    optimistic: true
    turn_on_action:
      - output.turn_on: r_HiLim_1
      - output.turn_on: r_HiLim_2
      - delay: 500ms
      - switch.turn_on: r_P1_low
      - delay: 500ms
      - output.turn_on: r_Heater
    turn_off_action:
      - output.turn_off: r_Heater
      - delay: 500ms
      - switch.turn_off: r_P1_low
      - output.turn_off: r_HiLim_2
      - output.turn_off: r_HiLim_1


## ═════════════════════════════════════════════════════════════════════
## SENSORS — temperature measurement chain
## ═════════════════════════════════════════════════════════════════════

sensor:

  ## ── OUTLET TEMPERATURE (Pin 6 / GPIO35) ─────────────────────────────
  ## OEM sensor — built into the Apollo 11 relay box, physically attached
  ## to the heater manifold outlet. Signal carried through DB15 connector.
  - platform: adc
    id: outlet_sensor
    pin: GPIO39
    update_interval: 2s
    name: Outlet Voltage
    attenuation: auto

  - platform: resistance
    id: outlet_resistance
    sensor: outlet_sensor
    configuration: DOWNSTREAM
    resistor: 9.0kOhm
    name: Outlet Resistance Sensor

  - platform: ntc
    sensor: outlet_resistance
    calibration:
      - 10.0kOhm -> 25°C
      - 32.665kOhm -> 0°C
      - 6.530kOhm -> 35°C
    id: outlet_temp
    name: Outlet Temperature
    filters:
      - median:
          window_size: 5
          send_every: 1
      - exponential_moving_average:
          alpha: 0.15
          send_every: 1
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(boot_testing_active);'
            then:
              - script.execute: check_high_temp_alarm

  ## ── INLET TEMPERATURE (Pin 5 / GPIO34) ──────────────────────────────
  ## OEM sensor — built into the Apollo 11 relay box, physically attached
  ## to the heater manifold inlet. Signal carried through DB15 connector.
  - platform: adc
    id: inlet_sensor
    pin: GPIO36
    update_interval: 2s
    name: Inlet Voltage
    attenuation: auto

  - platform: resistance
    id: inlet_resistance
    sensor: inlet_sensor
    configuration: DOWNSTREAM
    resistor: 9.0kOhm
    name: Inlet Resistance Sensor

  - platform: ntc
    sensor: inlet_resistance
    calibration:
      - 10.0kOhm -> 25°C
      - 32.665kOhm -> 0°C
      - 6.530kOhm -> 35°C
    id: inlet_temp
    name: Inlet Temperature
    filters:
      - median:
          window_size: 5
          send_every: 1
      - exponential_moving_average:
          alpha: 0.15
          send_every: 1
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !id(boot_testing_active);'
            then:
              - script.execute: check_high_temp_alarm

  ## ── SPA / JACUZZI TEMPERATURE (Pin 7 / GPIO39) ──────────────────────
  ## EXTERNAL sensor — added as part of this project. NOT part of the
  ## Apollo 11 relay box. Wired directly to the ESP32 to measure the
  ## actual spa body water temperature for thermostat control.
  ## NOTE: This sensor uses a 10.0 kOhm pull-down reference resistor
  ## with UPSTREAM NTC configuration, unlike the OEM inlet/outlet
  ## which use 9.0 kOhm DOWNSTREAM.
  - platform: adc
    id: spa_sensor
    pin: GPIO34
    update_interval: 10s
    name: Spa Voltage
    attenuation: auto

  - platform: resistance
    id: spa_resistance
    sensor: spa_sensor
    configuration: UPSTREAM
    resistor: 10.0kOhm
    name: Spa Resistance Sensor

  ## Raw NTC output — used as the source for the calibrated template sensor.
  ## Not hidden from HA so you can compare raw vs. corrected on a dashboard.
  - platform: ntc
    sensor: spa_resistance
    calibration:
      - 10.0kOhm -> 25°C
      - 32.665kOhm -> 0°C
      - 6.530kOhm -> 35°C
    id: spa_temp_raw
    name: Spa Temperature Raw
    filters:
      - median:
          window_size: 5
          send_every: 1
      - exponential_moving_average:
          alpha: 0.15
          send_every: 1

  ## Calibrated spa temperature — applies the user-adjustable offset from
  ## the spa_temp_offset global. This is the sensor referenced by the
  ## thermostat climate entity and the high-temp alarm.
  - platform: template
    name: "Spa Temperature"
    id: spa_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (isnan(id(spa_temp_raw).state)) return NAN;
      return id(spa_temp_raw).state + id(spa_temp_offset);


  ## ── WiFi Signal Strength (for OLED display) ───────────────────────
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 30s
    internal: true


## ═════════════════════════════════════════════════════════════════════
## BINARY SENSORS — boolean status exposed to Home Assistant
## ═════════════════════════════════════════════════════════════════════

binary_sensor:

  - platform: template
    name: "Startup Test Complete"
    id: startup_test_complete_sensor
    lambda: 'return id(startup_test_complete);'

  - platform: template
    name: "High Temperature Alarm"
    id: high_temp_alarm_sensor
    lambda: 'return id(high_temp_alarm);'

  - platform: template
    name: "Hi-Limit Relay Triggered"
    id: hi_limit_triggered_sensor
    lambda: 'return id(hi_limit_triggered);'

  - platform: template
    name: "Boot Failed"
    id: boot_failed_sensor
    lambda: 'return id(boot_failed);'

  ## ── Pump Running Status ──────────────────────────────────────────────
  ## Since the pump GPIO switches are internal: true (hidden from HA),
  ## these binary sensors expose pump on/off state to HA dashboards for
  ## status indicators and conditional card visibility.
  - platform: template
    name: "Pump 1 Low Running"
    lambda: 'return id(r_P1_low).state;'

  - platform: template
    name: "Pump 1 High Running"
    lambda: 'return id(r_P1_high).state;'

  - platform: template
    name: "Pump 2 High Running"
    lambda: 'return id(r_P2_high).state;'

  ## ── Faceplate Buttons (right-side GPIOs, active LOW, internal) ────────
  - platform: gpio
    id: btn_p1
    pin: {number: GPIO19, mode: INPUT_PULLUP, inverted: true}
    internal: true
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press:
      - script.execute: faceplate_p1_cycle

  - platform: gpio
    id: btn_p2
    pin: {number: GPIO18, mode: INPUT_PULLUP, inverted: true}
    internal: true
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press:
      - script.execute: faceplate_p2_cycle

  - platform: gpio
    id: btn_temp_up
    pin: {number: GPIO5, mode: INPUT_PULLUP, inverted: true}
    internal: true
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press:
      - script.execute: adjust_setpoint_up

  - platform: gpio
    id: btn_temp_down
    pin: {number: GPIO17, mode: INPUT_PULLUP, inverted: true}
    internal: true
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press:
      - script.execute: adjust_setpoint_down
