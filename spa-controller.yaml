            id: lbl_temp_current
            x: 2
            y: 14
            text_font: font_temp
            text: "--.-°F"
        - label:
            id: lbl_temp_setpoint
            x: 2
            y: 38
            text_font: font_info
            text: "Set: --.-°C"
        - label:
            id: lbl_p1
            x: 6
            y: 54
            text_font: font_label
            text: "P1:Off"
        - label:
            id: lbl_p2
            x: 50
            y: 54
            text_font: font_label
