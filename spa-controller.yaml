esphome:
  name: spa-controller
  friendly_name: Spa Controller
  on_boot:
    ## Priority 600 = runs after network is up and sensors are initialised.
    ## NOTE: script.execute is async — do NOT put actions after it that
    ## depend on the test being complete. Circ pump is started inside
    ## the test completion handler, not here.
    priority: 600
    then:
      - script.execute: startup_test_sequence

